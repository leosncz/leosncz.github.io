:root {
  --bg:      #0A0A0F;
  --surface: #12121C;
  --card:    #1A1A2E;
  --border:  #2A2A40;
  --violet:  #7C3AED;
  --violet2: #A855F7;
  --text:    #E8E8F0;
  --muted:   #888899;
  --radius:  10px;
}

html { background: #0A0A0F; }

body {
  background-color: #0A0A0F;
  color: #E8E8F0;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0A0A0F; }
::-webkit-scrollbar-thumb { background: #7C3AED; border-radius: 3px; }

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid #2A2A40;
  padding: 0 1.25rem;
  height: 60px;
  display: flex;
  align-items: center;
  gap: .75rem;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -.02em;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
  display: flex;
  align-items: baseline;
  gap: 0;
  flex-shrink: 0;
}
.logo-b  { color: #7C3AED; animation: pb 2.4s ease-in-out infinite; }
.logo-o  { color: #E8E8F0; }
.logo-m  { color: #A855F7; animation: pm 2.4s ease-in-out infinite .6s; }
@keyframes pb { 0%,100%{opacity:1}  50%{opacity:.35} }
@keyframes pm { 0%,100%{opacity:.35} 50%{opacity:1} }

.search-wrap {
  flex: 1;
  position: relative;
  min-width: 0;
}
.search-wrap input {
  width: 100%;
  background: #1A1A2E;
  border: 1px solid #2A2A40;
  border-radius: 8px;
  color: #E8E8F0;
  font-family: 'Inter', sans-serif;
  font-size: .875rem;
  padding: .5rem .9rem .5rem 2.4rem;
  outline: none;
  transition: border-color .2s;
}
.search-wrap input::placeholder { color: #888899; }
.search-wrap input:focus { border-color: #7C3AED; }
.search-icon {
  position: absolute;
  left: .7rem;
  top: 50%;
  transform: translateY(-50%);
  color: #888899;
  pointer-events: none;
  width: 14px;
  height: 14px;
}

.type-tabs { display: flex; gap: .35rem; flex-shrink: 0; }
.tab-btn {
  background: #1A1A2E;
  border: 1px solid #2A2A40;
  color: #888899;
  font-family: 'Inter', sans-serif;
  font-size: .75rem;
  font-weight: 500;
  padding: .38rem .75rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.tab-btn:hover { border-color: #7C3AED; color: #E8E8F0; }
.tab-btn.active { background: #7C3AED; border-color: #7C3AED; color: #fff; }

/* MAIN */
main {
  padding: 1.5rem 1.25rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* SECTION TITLE */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  color: #E8E8F0;
  margin-bottom: 1rem;
  padding-left: .75rem;
  border-left: 3px solid #7C3AED;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: .85rem;
}

/* CARD */
.card {
  background: #1A1A2E;
  border: 1px solid #2A2A40;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, border-color .2s;
  position: relative;
}
.card:hover { transform: translateY(-3px); border-color: #7C3AED; }
.card:hover .card-play { opacity: 1; }

.card-poster {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: #12121C;
}
.card-poster-ph {
  width: 100%;
  aspect-ratio: 2/3;
  background: #12121C;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888899;
  font-size: 2rem;
}
.card-play {
  position: absolute;
  inset: 0;
  background: rgba(124,58,237,.4);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .2s;
}
.card-play svg {
  width: 44px;
  height: 44px;
  fill: #fff;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,.7));
}
.card-info { padding: .55rem .65rem .65rem; }
.card-title {
  font-size: .78rem;
  font-weight: 500;
  line-height: 1.3;
  margin-bottom: .25rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #E8E8F0;
}
.card-meta {
  font-size: .68rem;
  color: #888899;
  display: flex;
  flex-wrap: wrap;
  gap: .3rem;
  align-items: center;
}
.badge {
  font-size: .6rem;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 3px;
  color: #fff;
}
.badge-movie { background: #1d4ed8; }
.badge-tv    { background: #7C3AED; }

/* LOADER */
.loader {
  display: flex;
  justify-content: center;
  padding: 3rem 0;
}
.spinner {
  width: 32px; height: 32px;
  border: 3px solid #2A2A40;
  border-top-color: #7C3AED;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* EMPTY */
.empty {
  text-align: center;
  padding: 3rem 1rem;
  color: #888899;
}
.empty-icon { font-size: 2.5rem; margin-bottom: .75rem; }
.empty h3 { font-family: 'Syne', sans-serif; font-size: .95rem; color: #E8E8F0; margin-bottom: .3rem; }

/* HERO */
.hero { margin-bottom: 2rem; }
.hero-banner {
  width: 100%;
  background: linear-gradient(135deg, #12121C 0%, #1A1A2E 55%, #0d0a1f 100%);
  border-radius: 12px;
  border: 1px solid #2A2A40;
  padding: 2rem 1.75rem;
  position: relative;
  overflow: hidden;
}
.hero-banner::after {
  content: '';
  position: absolute;
  right: -40px; top: -40px;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(124,58,237,.3) 0%, transparent 70%);
  pointer-events: none;
}
.hero-text h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  font-weight: 800;
  line-height: 1.15;
  margin-bottom: .5rem;
  color: #E8E8F0;
}
.hero-text h1 span { color: #A855F7; }
.hero-text p {
  font-size: .875rem;
  color: #888899;
  line-height: 1.5;
  max-width: 340px;
}

/* MODAL */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 1rem;
  overflow-y: auto;
}
.modal-overlay.hidden { display: none; }

.modal {
  width: 100%;
  max-width: 940px;
  background: #12121C;
  border: 1px solid #2A2A40;
  border-radius: 12px;
  overflow: hidden;
  margin: auto;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .9rem 1.1rem;
  border-bottom: 1px solid #2A2A40;
  gap: .75rem;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: .95rem;
  font-weight: 700;
  color: #E8E8F0;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.modal-close {
  background: none;
  border: 1px solid #2A2A40;
  border-radius: 6px;
  color: #888899;
  cursor: pointer;
  padding: .3rem .6rem;
  font-size: .78rem;
  font-family: 'Inter', sans-serif;
  transition: border-color .2s, color .2s;
  flex-shrink: 0;
}
.modal-close:hover { border-color: #7C3AED; color: #E8E8F0; }

.player-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
}
.player-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

/* EPISODE BAR */
.episode-bar {
  padding: .9rem 1.1rem;
  border-top: 1px solid #2A2A40;
  background: #12121C;
}
.episode-bar.hidden { display: none; }
.ep-bar-label {
  font-size: .7rem;
  color: #888899;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: .5rem;
}
.season-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  margin-bottom: .65rem;
}
.season-btn {
  background: #1A1A2E;
  border: 1px solid #2A2A40;
  color: #888899;
  font-size: .73rem;
  padding: .28rem .65rem;
  border-radius: 5px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
}
.season-btn:hover, .season-btn.active {
  background: #7C3AED; border-color: #7C3AED; color: #fff;
}
.episode-list {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  max-height: 140px;
  overflow-y: auto;
}
.ep-btn {
  background: #1A1A2E;
  border: 1px solid #2A2A40;
  color: #888899;
  font-size: .7rem;
  padding: .28rem .55rem;
  border-radius: 5px;
  cursor: pointer;
  transition: background .15s, border-color .15s, color .15s;
  white-space: nowrap;
}
.ep-btn:hover { border-color: #7C3AED; color: #E8E8F0; }
.ep-btn.active { background: #7C3AED; border-color: #7C3AED; color: #fff; }

@media (max-width: 500px) {
  .type-tabs .tab-btn { padding: .35rem .55rem; font-size: .7rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: .65rem; }
}

  <div id="searchPage" style="display:none;">
    <div class="section-title" id="searchLabel">Resultats</div>
    <div id="searchResults"></div>
  </div>
</main>

<!-- MODAL PLAYER -->

<div class="modal-overlay hidden" id="playerOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="playerTitle">—</div>
      <button class="modal-close" id="closePlayer">Fermer</button>
    </div>
    <div class="player-wrap">
      <iframe id="playerIframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
    <div class="episode-bar hidden" id="episodeBar">
      <div class="ep-bar-label">Episodes</div>
      <div class="season-tabs" id="seasonTabs"></div>
      <div class="episode-list" id="episodeList"></div>
    </div>
  </div>
</div>

<script>
  const TMDB_KEY   = '8265bd1679663a7ea12ac168da84d2e8';
  const TMDB_BASE  = 'https://api.themoviedb.org/3';
  const IMG_BASE   = 'https://image.tmdb.org/t/p/w300';
  const EMBED_BASE = 'https://vidsrcme.ru/embed';

  let searchTimer = null;
  let currentType = 'all';
  let currentMedia = null;

  const $ = id => document.getElementById(id);

  async function tmdb(path, params) {
    params = params || {};
    var url = new URL(TMDB_BASE + path);
    url.searchParams.set('api_key', TMDB_KEY);
    url.searchParams.set('language', 'fr-FR');
    Object.keys(params).forEach(function(k){ url.searchParams.set(k, params[k]); });
    var r = await fetch(url.toString());
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  function renderCards(items, container) {
    if (!items || !items.length) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">&#127916;</div><h3>Rien a afficher</h3><p>Essaie un autre terme.</p></div>';
      return;
    }
    var html = '<div class="grid">';
    items.forEach(function(item) {
      var type  = item.media_type || (item.first_air_date ? 'tv' : 'movie');
      var title = item.title || item.name || '-';
      var year  = (item.release_date || item.first_air_date || '').slice(0,4);
      var vote  = item.vote_average ? item.vote_average.toFixed(1) : '';
      var poster = item.poster_path
        ? '<img class="card-poster" src="' + IMG_BASE + item.poster_path + '" alt="" loading="lazy" />'
        : '<div class="card-poster-ph">&#127902;</div>';
      var badge = type === 'tv'
        ? '<span class="badge badge-tv">Serie</span>'
        : '<span class="badge badge-movie">Film</span>';
      var safeTitle = title.replace(/"/g, '&quot;');
      html += '<div class="card" data-id="' + item.id + '" data-type="' + type + '" data-title="' + safeTitle + '">';
      html += poster;
      html += '<div class="card-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>';
      html += '<div class="card-info">';
      html += '<div class="card-title">' + title + '</div>';
      html += '<div class="card-meta">' + badge + (year ? '<span>' + year + '</span>' : '') + (vote ? '<span>&#11088; ' + vote + '</span>' : '') + '</div>';
      html += '</div></div>';
    });
    html += '</div>';
    container.innerHTML = html;
    container.querySelectorAll('.card').forEach(function(c) {
      c.addEventListener('click', function() {
        openMedia(parseInt(c.dataset.id), c.dataset.type, c.dataset.title);
      });
    });
  }

  async function loadTrending() {
    try {
      var results = await Promise.all([
        tmdb('/trending/movie/week'),
        tmdb('/trending/tv/week')
      ]);
      var mBox = $('trendingMovies');
      mBox.innerHTML = '<div class="section-title">Films populaires</div>';
      renderCards(results[0].results.slice(0,20), mBox);

      var tvBox = $('trendingTV');
      tvBox.innerHTML = '<div class="section-title">Series populaires</div>';
      renderCards(results[1].results.slice(0,20), tvBox);
    } catch(e) {
      $('trendingMovies').innerHTML = '<div class="empty"><div class="empty-icon">&#9888;</div><h3>Impossible de charger</h3><p>Verifie ta connexion.</p></div>';
      $('trendingTV').innerHTML = '';
    }
  }

  async function search(query) {
    if (!query.trim()) { showHome(); return; }
    $('homePage').style.display = 'none';
    $('searchPage').style.display = 'block';
    $('searchLabel').textContent = 'Resultats pour "' + query + '"';
    $('searchResults').innerHTML = '<div class="loader"><div class="spinner"></div></div>';
    try {
      var results = [];
      if (currentType === 'all') {
        var d = await tmdb('/search/multi', { query: query, include_adult: false });
        results = d.results.filter(function(r) { return r.media_type === 'movie' || r.media_type === 'tv'; });
      } else {
        var d = await tmdb('/search/' + currentType, { query: query, include_adult: false });
        var t = currentType;
        results = d.results.map(function(r) { return Object.assign({}, r, { media_type: t }); });
      }
      renderCards(results, $('searchResults'));
    } catch(e) {
      $('searchResults').innerHTML = '<div class="empty"><div class="empty-icon">&#9888;</div><h3>Erreur de recherche</h3></div>';
    }
  }

  function showHome() {
    $('homePage').style.display = 'block';
    $('searchPage').style.display = 'none';
  }

  async function openMedia(id, type, title) {
    currentMedia = { id: id, type: type, title: title, season: 1, episode: 1, seasons: [] };
    $('playerTitle').textContent = title;
    $('playerOverlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';

    if (type === 'tv') {
      $('episodeBar').classList.remove('hidden');
      $('seasonTabs').innerHTML = '<div class="loader" style="padding:.4rem 0"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div></div>';
      $('episodeList').innerHTML = '';
      loadEpisodes(id, 1);
    } else {
      $('episodeBar').classList.add('hidden');
      $('playerIframe').src = EMBED_BASE + '/movie/' + id + '?autoplay=1';
    }
  }

  async function loadEpisodes(id, season) {
    currentMedia.season = season;
    currentMedia.episode = 1;

    if (!currentMedia.seasons.length) {
      try {
        var d = await tmdb('/tv/' + id);
        var n = d.number_of_seasons;
        currentMedia.seasons = [];
        for (var i = 1; i <= n; i++) currentMedia.seasons.push(i);
      } catch(e) {
        currentMedia.seasons = [1];
      }
    }

    var seasonHTML = '';
    currentMedia.seasons.forEach(function(s) {
      var active = s === season ? ' active' : '';
      seasonHTML += '<button class="season-btn' + active + '" data-s="' + s + '">S' + s + '</button>';
    });
    $('seasonTabs').innerHTML = seasonHTML;
    $('seasonTabs').querySelectorAll('.season-btn').forEach(function(b) {
      b.addEventListener('click', function() { loadEpisodes(id, parseInt(b.dataset.s)); });
    });

    $('episodeList').innerHTML = '<div class="loader" style="padding:.3rem 0"><div class="spinner" style="width:16px;height:16px;border-width:2px"></div></div>';
    try {
      var d = await tmdb('/tv/' + id + '/season/' + season);
      var eps = d.episodes || [];
      var epHTML = '';
      eps.forEach(function(ep) {
        var active = ep.episode_number === 1 ? ' active' : '';
        var name = ep.name ? ' - ' + ep.name.slice(0,28) : '';
        epHTML += '<button class="ep-btn' + active + '" data-e="' + ep.episode_number + '">E' + ep.episode_number + name + '</button>';
      });
      $('episodeList').innerHTML = epHTML;
      $('episodeList').querySelectorAll('.ep-btn').forEach(function(b) {
        b.addEventListener('click', function() {
          $('episodeList').querySelectorAll('.ep-btn').forEach(function(x) { x.classList.remove('active'); });
          b.classList.add('active');
          $('playerIframe').src = EMBED_BASE + '/tv/' + id + '/' + season + '/' + b.dataset.e + '?autoplay=1';
        });
      });
      $('playerIframe').src = EMBED_BASE + '/tv/' + id + '/' + season + '/1?autoplay=1';
    } catch(e) {
      $('episodeList').innerHTML = '<span style="color:#888899;font-size:.73rem">Impossible de charger les episodes.</span>';
    }
  }

  $('closePlayer').addEventListener('click', function() {
    $('playerOverlay').classList.add('hidden');
    $('playerIframe').src = '';
    document.body.style.overflow = '';
    currentMedia = null;
  });

  $('playerOverlay').addEventListener('click', function(e) {
    if (e.target === $('playerOverlay')) $('closePlayer').click();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') $('closePlayer').click();
  });

  $('searchInput').addEventListener('input', function(e) {
    clearTimeout(searchTimer);
    var v = e.target.value;
    searchTimer = setTimeout(function() { search(v); }, 420);
  });

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentType = btn.dataset.type;
      var q = $('searchInput').value.trim();
      if (q) search(q);
    });
  });

  $('logoHome').addEventListener('click', function() {
    $('searchInput').value = '';
    showHome();
  });

  loadTrending();
</script>

</body>
