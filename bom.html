:root {
  --bg:       #0A0A0F;
  --surface:  #12121C;
  --card:     #1A1A2E;
  --border:   #2A2A40;
  --violet:   #7C3AED;
  --violet2:  #A855F7;
  --text:     #E8E8F0;
  --muted:    #888899;
  --radius:   10px;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--violet); border-radius: 3px; }

/* ══ HEADER ══ */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,15,.88);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.6rem;
  letter-spacing: -.02em;
  display: flex;
  align-items: center;
  gap: 0;
  cursor: pointer;
  user-select: none;
  text-decoration: none;
}
.logo-b  { color: var(--violet); animation: pulse-b 2.4s ease-in-out infinite; }
.logo-o  { color: var(--text); }
.logo-m  { color: var(--violet2); animation: pulse-m 2.4s ease-in-out infinite .6s; }

@keyframes pulse-b  { 0%,100%{opacity:1} 50%{opacity:.45} }
@keyframes pulse-m  { 0%,100%{opacity:.45} 50%{opacity:1} }

.logo-tag {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-left: .5rem;
  align-self: flex-end;
  padding-bottom: 3px;
}

/* ── SEARCH BAR ── */
.search-wrap {
  flex: 1;
  max-width: 480px;
  position: relative;
}
.search-wrap input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: .875rem;
  padding: .55rem 1rem .55rem 2.6rem;
  outline: none;
  transition: border-color .2s;
}
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap input:focus { border-color: var(--violet); }
.search-icon {
  position: absolute;
  left: .75rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

/* type tabs */
.type-tabs {
  display: flex;
  gap: .5rem;
}
.tab-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'Inter', sans-serif;
  font-size: .78rem;
  font-weight: 500;
  padding: .4rem .9rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.tab-btn:hover { border-color: var(--violet); color: var(--text); }
.tab-btn.active { background: var(--violet); border-color: var(--violet); color: #fff; }

/* ══ MAIN ══ */
main {
  padding: 2rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* section title */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--text);
  margin-bottom: 1.25rem;
  display: flex;
  align-items: center;
  gap: .6rem;
}
.section-title::before {
  content: '';
  display: block;
  width: 3px;
  height: 1.1rem;
  background: var(--violet);
  border-radius: 2px;
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 1rem;
}

/* ── CARD ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform .2s, border-color .2s;
  position: relative;
}
.card:hover { transform: translateY(-3px); border-color: var(--violet); }
.card:hover .card-play { opacity: 1; }

.card-poster {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: var(--surface);
}
.card-poster-placeholder {
  width: 100%;
  aspect-ratio: 2/3;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 2rem;
}

.card-play {
  position: absolute;
  inset: 0;
  background: rgba(124,58,237,.35);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity .2s;
}
.card-play svg { width: 48px; height: 48px; fill: #fff; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }

.card-info {
  padding: .6rem .75rem .75rem;
}
.card-title {
  font-size: .8rem;
  font-weight: 500;
  line-height: 1.3;
  margin-bottom: .2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-meta {
  font-size: .7rem;
  color: var(--muted);
  display: flex;
  gap: .4rem;
  align-items: center;
}
.badge {
  background: var(--violet);
  color: #fff;
  font-size: .6rem;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 3px;
}

/* ── LOADER ── */
.loader {
  display: flex;
  justify-content: center;
  padding: 3rem 0;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--violet);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── EMPTY / ERROR ── */
.empty {
  text-align: center;
  padding: 4rem 1rem;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 1rem; }
.empty h3 { font-family: 'Syne', sans-serif; font-size: 1rem; color: var(--text); margin-bottom: .4rem; }

/* ══ MODAL PLAYER ══ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 1rem;
  overflow-y: auto;
}
.modal-overlay.hidden { display: none; }

.modal {
  width: 100%;
  max-width: 960px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
}
.modal-title {
  font-family: 'Syne', sans-serif;
  font-size: 1rem;
  font-weight: 700;
  flex: 1;
}
.modal-close {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  padding: .35rem .65rem;
  font-size: .8rem;
  transition: all .2s;
}
.modal-close:hover { border-color: var(--violet); color: var(--text); }

.player-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
}
.player-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* episode selector */
.episode-bar {
  padding: 1rem 1.25rem;
  border-top: 1px solid var(--border);
}
.episode-bar.hidden { display: none; }
.episode-bar-title {
  font-size: .75rem;
  color: var(--muted);
  margin-bottom: .6rem;
  text-transform: uppercase;
  letter-spacing: .08em;
}
.season-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  margin-bottom: .75rem;
}
.season-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: .75rem;
  padding: .3rem .7rem;
  border-radius: 5px;
  cursor: pointer;
  transition: all .15s;
}
.season-btn:hover, .season-btn.active { background: var(--violet); border-color: var(--violet); color: #fff; }

.episode-list {
  display: flex;
  flex-wrap: wrap;
  gap: .4rem;
  max-height: 160px;
  overflow-y: auto;
}
.ep-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: .72rem;
  padding: .3rem .6rem;
  border-radius: 5px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.ep-btn:hover { border-color: var(--violet); color: var(--text); }
.ep-btn.active { background: var(--violet); border-color: var(--violet); color: #fff; }

/* ── HERO (homepage) ── */
.hero {
  margin-bottom: 2.5rem;
}
.hero-banner {
  width: 100%;
  height: 300px;
  background: linear-gradient(135deg, #12121C 0%, #1A1A2E 50%, #0d0a1f 100%);
  border-radius: 14px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 2.5rem;
  position: relative;
  overflow: hidden;
}
.hero-banner::after {
  content: '';
  position: absolute;
  right: -60px;
  top: -60px;
  width: 320px;
  height: 320px;
  background: radial-gradient(circle, rgba(124,58,237,.25) 0%, transparent 70%);
  pointer-events: none;
}
.hero-text h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(1.6rem, 4vw, 2.8rem);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: .6rem;
}
.hero-text h1 span { color: var(--violet2); }
.hero-text p {
  font-size: .9rem;
  color: var(--muted);
  max-width: 380px;
  line-height: 1.5;
}

/* responsive */
@media (max-width: 640px) {
  header { padding: 0 1rem; gap: .5rem; }
  .logo-tag { display: none; }
  .type-tabs { gap: .3rem; }
  .tab-btn { padding: .35rem .6rem; font-size: .72rem; }
  main { padding: 1rem; }
  .hero-banner { height: auto; padding: 1.5rem; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .75rem; }
}

  <!-- Search results -->

  <div id="searchPage" style="display:none;">
    <div class="section-title" id="searchLabel">Résultats</div>
    <div id="searchResults"></div>
  </div>
</main>

<!-- ══ MODAL PLAYER ══ -->

<div class="modal-overlay hidden" id="playerOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="playerTitle">—</div>
      <button class="modal-close" id="closePlayer">✕ Fermer</button>
    </div>
    <div class="player-wrap">
      <iframe id="playerIframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
    <div class="episode-bar hidden" id="episodeBar">
      <div class="episode-bar-title">Épisodes</div>
      <div class="season-tabs" id="seasonTabs"></div>
      <div class="episode-list" id="episodeList"></div>
    </div>
  </div>
</div>

<script>
  // ══ CONFIG ══
  const TMDB_KEY  = '8265bd1679663a7ea12ac168da84d2e8'; // public demo key
  const TMDB_BASE = 'https://api.themoviedb.org/3';
  const IMG_BASE  = 'https://image.tmdb.org/t/p/w300';
  const EMBED_BASE = 'https://vidsrcme.ru/embed';

  // ══ STATE ══
  let searchTimer = null;
  let currentType = 'all';
  let currentMedia = null; // { id, type, seasons }

  // ══ HELPERS ══
  const $ = id => document.getElementById(id);
  const tmdb = async (path, params = {}) => {
    const url = new URL(TMDB_BASE + path);
    url.searchParams.set('api_key', TMDB_KEY);
    url.searchParams.set('language', 'fr-FR');
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return r.json();
  };

  // ══ RENDER CARDS ══
  function renderCards(items, container) {
    if (!items.length) {
      container.innerHTML = `<div class="empty"><div class="empty-icon">🎬</div><h3>Rien à afficher</h3><p>Essaie un autre terme.</p></div>`;
      return;
    }
    container.innerHTML = `<div class="grid">${items.map(cardHTML).join('')}</div>`;
    container.querySelectorAll('.card').forEach(c => {
      c.addEventListener('click', () => openMedia(
        parseInt(c.dataset.id),
        c.dataset.type,
        c.dataset.title,
        c.dataset.imdb || ''
      ));
    });
  }

  function cardHTML(item) {
    const type   = item.media_type || (item.first_air_date ? 'tv' : 'movie');
    const title  = item.title || item.name || '—';
    const year   = (item.release_date || item.first_air_date || '').slice(0,4);
    const poster = item.poster_path ? `<img class="card-poster" src="${IMG_BASE}${item.poster_path}" alt="" loading="lazy" />` : `<div class="card-poster-placeholder">🎞</div>`;
    const badge  = type === 'tv' ? '<span class="badge">Série</span>' : '<span class="badge" style="background:#1d4ed8">Film</span>';
    const vote   = item.vote_average ? `⭐ ${item.vote_average.toFixed(1)}` : '';
    return `
      <div class="card" data-id="${item.id}" data-type="${type}" data-title="${title.replace(/"/g,'&quot;')}">
        ${poster}
        <div class="card-play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="card-info">
          <div class="card-title">${title}</div>
          <div class="card-meta">${badge}${year ? `<span>${year}</span>` : ''}${vote ? `<span>${vote}</span>` : ''}</div>
        </div>
      </div>`;
  }

  // ══ LOAD TRENDING ══
  async function loadTrending() {
    try {
      const [movies, tv] = await Promise.all([
        tmdb('/trending/movie/week'),
        tmdb('/trending/tv/week')
      ]);
      const mBox = $('trendingMovies');
      mBox.innerHTML = `<div class="section-title">Films populaires</div>`;
      renderCards(movies.results.slice(0,20), mBox);

      const tvBox = $('trendingTV');
      tvBox.innerHTML = `<div class="section-title">Séries populaires</div>`;
      renderCards(tv.results.slice(0,20), tvBox);
    } catch(e) {
      $('trendingMovies').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><h3>Impossible de charger</h3><p>Vérifie ta connexion.</p></div>';
      $('trendingTV').innerHTML = '';
    }
  }

  // ══ SEARCH ══
  async function search(query) {
    if (!query.trim()) { showHome(); return; }

    $('homePage').style.display = 'none';
    $('searchPage').style.display = 'block';
    $('searchLabel').textContent = `Résultats pour "${query}"`;
    $('searchResults').innerHTML = `<div class="loader"><div class="spinner"></div></div>`;

    try {
      let results = [];
      if (currentType === 'all') {
        const d = await tmdb('/search/multi', { query, include_adult: false });
        results = d.results.filter(r => r.media_type === 'movie' || r.media_type === 'tv');
      } else {
        const d = await tmdb(`/search/${currentType}`, { query, include_adult: false });
        results = d.results.map(r => ({ ...r, media_type: currentType }));
      }
      renderCards(results, $('searchResults'));
    } catch(e) {
      $('searchResults').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><h3>Erreur de recherche</h3></div>';
    }
  }

  function showHome() {
    $('homePage').style.display = 'block';
    $('searchPage').style.display = 'none';
  }

  // ══ OPEN MEDIA ══
  async function openMedia(id, type, title) {
    currentMedia = { id, type, title, season: 1, episode: 1, seasons: [] };
    $('playerTitle').textContent = title;
    $('playerOverlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';

    if (type === 'tv') {
      $('episodeBar').classList.remove('hidden');
      $('seasonTabs').innerHTML = `<div class="loader" style="padding:.5rem 0"><div class="spinner" style="width:20px;height:20px;border-width:2px"></div></div>`;
      $('episodeList').innerHTML = '';
      loadEpisodes(id, 1);
    } else {
      $('episodeBar').classList.add('hidden');
      setPlayerSrc(`${EMBED_BASE}/movie/${id}?autoplay=1`);
    }
  }

  async function loadEpisodes(id, season) {
    currentMedia.season = season;
    currentMedia.episode = 1;

    // Load season count if not known
    if (!currentMedia.seasons.length) {
      try {
        const d = await tmdb(`/tv/${id}`);
        currentMedia.seasons = Array.from({ length: d.number_of_seasons }, (_, i) => i + 1);
      } catch { currentMedia.seasons = [1]; }
    }

    // Render season tabs
    $('seasonTabs').innerHTML = currentMedia.seasons.map(s =>
      `<button class="season-btn${s === season ? ' active' : ''}" data-s="${s}">S${s}</button>`
    ).join('');
    $('seasonTabs').querySelectorAll('.season-btn').forEach(b => {
      b.addEventListener('click', () => loadEpisodes(id, parseInt(b.dataset.s)));
    });

    // Load episodes
    $('episodeList').innerHTML = `<div class="loader" style="padding:.3rem 0"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div></div>`;
    try {
      const d = await tmdb(`/tv/${id}/season/${season}`);
      const eps = d.episodes || [];
      $('episodeList').innerHTML = eps.map(ep =>
        `<button class="ep-btn${ep.episode_number === 1 ? ' active' : ''}" data-e="${ep.episode_number}">E${ep.episode_number}${ep.name ? ' · ' + ep.name.slice(0,30) : ''}</button>`
      ).join('');
      $('episodeList').querySelectorAll('.ep-btn').forEach(b => {
        b.addEventListener('click', () => {
          $('episodeList').querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          const ep = parseInt(b.dataset.e);
          currentMedia.episode = ep;
          setPlayerSrc(`${EMBED_BASE}/tv/${id}/${season}/${ep}?autoplay=1`);
        });
      });
      // Auto-play first episode
      setPlayerSrc(`${EMBED_BASE}/tv/${id}/${season}/1?autoplay=1`);
    } catch {
      $('episodeList').innerHTML = '<span style="color:var(--muted);font-size:.75rem">Impossible de charger les épisodes.</span>';
    }
  }

  function setPlayerSrc(src) {
    $('playerIframe').src = src;
  }

  // ══ CLOSE PLAYER ══
  $('closePlayer').addEventListener('click', () => {
    $('playerOverlay').classList.add('hidden');
    $('playerIframe').src = '';
    document.body.style.overflow = '';
    currentMedia = null;
  });
  $('playerOverlay').addEventListener('click', e => {
    if (e.target === $('playerOverlay')) $('closePlayer').click();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('closePlayer').click();
  });

  // ══ SEARCH INPUT ══
  $('searchInput').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => search(e.target.value), 400);
  });

  // ══ TYPE TABS ══
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentType = btn.dataset.type;
      const q = $('searchInput').value.trim();
      if (q) search(q);
    });
  });

  // ══ LOGO HOME ══
  $('logoHome').addEventListener('click', () => {
