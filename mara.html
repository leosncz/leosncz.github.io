<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Ombres Oubliées 🌑</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void-black: #0a0a0f;
            --blood-red: #8b0000;
            --ash-gray: #2a2a3e;
            --bone-white: #e8e8e8;
            --ghost-blue: #4a6fa5;
            --shadow: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: linear-gradient(135deg, var(--void-black) 0%, var(--ash-gray) 100%);
            color: var(--bone-white);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .fog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 10, 15, 0.5) 100%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-card {
            background: rgba(42, 42, 62, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 10px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px var(--shadow), 
                        inset 0 0 0 1px rgba(74, 111, 165, 0.2);
            border: 1px solid rgba(139, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            color: var(--bone-white);
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }

        .subtitle {
            text-align: center;
            color: var(--ghost-blue);
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .scene-text {
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: justify;
            color: var(--bone-white);
            opacity: 0;
            animation: textAppear 0.6s ease-out 0.2s forwards;
        }

        @keyframes textAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice-btn {
            background: linear-gradient(135deg, rgba(74, 111, 165, 0.2), rgba(139, 0, 0, 0.2));
            border: 2px solid var(--blood-red);
            color: var(--bone-white);
            padding: 18px 25px;
            border-radius: 8px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: choiceAppear 0.5s ease-out forwards;
        }

        .choice-btn:nth-child(1) { animation-delay: 0.3s; }
        .choice-btn:nth-child(2) { animation-delay: 0.4s; }

        @keyframes choiceAppear {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, rgba(74, 111, 165, 0.4), rgba(139, 0, 0, 0.4));
            border-color: var(--ghost-blue);
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.4);
        }

        .choice-btn:active {
            transform: translateX(10px) scale(0.98);
        }

        .start-btn {
            background: linear-gradient(135deg, var(--blood-red), var(--ash-gray));
            border: 2px solid var(--ghost-blue);
            color: var(--bone-white);
            padding: 20px 50px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.5);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(139, 0, 0, 0.7);
        }

        .scene-number {
            text-align: center;
            color: var(--ghost-blue);
            font-size: 0.9em;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .death-screen {
            text-align: center;
        }

        .death-title {
            font-size: 2em;
            color: var(--blood-red);
            margin-bottom: 20px;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--ghost-blue), var(--blood-red));
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(74, 111, 165, 0.5);
        }

        .final-scroll {
            background: rgba(139, 0, 0, 0.1);
            border: 3px solid var(--blood-red);
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .game-card {
                padding: 30px 20px;
            }

            .title {
                font-size: 1.8em;
            }

            .scene-text {
                font-size: 1.05em;
            }

            .choice-btn {
                padding: 15px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="fog"></div>

    <div class="container">
        <div class="game-card">
            <div id="game-content"></div>
        </div>
    </div>

    <script>
        const scenes = {
            start: {
                text: "Le silence te réveille. Pas un bruit. Pas un mouvement. Juste le vide.\n\nTu ouvres les yeux dans une chambre inconnue, baignée d'une lumière grise. Ton esprit est une page blanche, arrachée d'un livre que tu ne te rappelles pas avoir lu. Qui es-tu ? Où es-tu ? Pourquoi ce sentiment d'avoir perdu quelque chose d'infiniment précieux ?\n\nUne silhouette apparaît dans l'embrasure de la porte. Cheveux roux, regard fatigué. « Tu es réveillée... enfin. » Sa voix est empreinte d'un soulagement teinté d'amertume.\n\nDans un coin de la pièce, tu aperçois un balai ancien appuyé contre le mur, sa surface gravée de runes qui semblent pulser faiblement.",
                choices: [
                    { text: "« Qui êtes-vous ? »", next: "scene1" },
                    { text: "Rester silencieuse et observer", next: "scene2" }
                ]
            },

            scene1: {
                text: "« Kiki. » Elle s'approche lentement, comme si elle craignait de te briser. « Nous vivons ensemble depuis six mois. Tu es... tu étais une sorcière prometteuse. » Son regard s'assombrit. « Il y a trois semaines, tu as tenté un rituel interdit. Pour sauver quelqu'un. Ça t'a détruite de l'intérieur. »\n\nUn chat noir aux yeux dorés observe depuis le rebord de la fenêtre, silencieux comme un juge.\n\n« Tu as tout perdu. Tes souvenirs. Ta magie. Et peut-être... » Elle s'interrompt, détournant le regard. « Ce balai là-bas... c'était le tien. Tu volais plus haut que quiconque. »",
                choices: [
                    { text: "« Qui ai-je essayé de sauver ? »", next: "scene3" },
                    { text: "« Apprends-moi à nouveau. La magie. Le vol. Tout. »", next: "scene4" }
                ]
            },

            scene2: {
                text: "Tu l'observes en silence. Elle porte le poids du monde sur ses épaules. Derrière elle, des cristaux fissurés pendent au plafond, des livres brûlés empilés dans les coins. Les traces d'une catastrophe.\n\nSur le mur, une photo déchirée : toi et elle, et une troisième personne dont le visage a été arraché. Quelqu'un que tu as oublié. Quelqu'un d'important.\n\n« Tu ne te souviens vraiment de rien ? » Sa voix se brise légèrement.",
                choices: [
                    { text: "« Parle-moi de cette photo »", next: "scene5" },
                    { text: "« Que s'est-il passé ici ? »", next: "scene1" }
                ]
            },

            scene3: {
                text: "Kiki ferme les yeux, comme si le souvenir était douloureux. « Quelqu'un qui comptait plus que tout pour toi. Quelqu'un que tu aimais au point de risquer ton existence même. »\n\nElle sort un parchemin de sa poche, scellé de cire noire. « Cette personne t'a laissé un message. Pour quand tu te réveillerais... si tu te réveillais. Mais je ne peux te le donner que si tu prouves que tu es encore toi. Que Mara existe encore quelque part sous le vide. »",
                choices: [
                    { text: "« Comment prouver qui je suis si je ne me souviens de rien ? »", next: "scene6" },
                    { text: "« Donne-moi ce message. Maintenant. »", next: "scene7" }
                ]
            },

            scene4: {
                text: "Kiki ouvre un grimoire ancien. « La magie n'est pas seulement du pouvoir. C'est de la discipline. De la précision. Un mot de travers, et... » Elle ne finit pas sa phrase.\n\nElle te montre trois formules de base :\n\n« LEVITAS » - Pour faire léviter les objets\n« IGNIS MINOR » - Pour créer une petite flamme\n« VENTUS » - Pour invoquer le vent\n\n« Commence simple, » avertit-elle. « Et surtout, prononce-les exactement comme écrit. »",
                choices: [
                    { text: "Essayer LEVITAS sur une plume", next: "scene31" },
                    { text: "Tenter IGNIS MINOR pour allumer une bougie", next: "scene32" }
                ]
            },

            scene5: {
                text: "Kiki prend la photo déchirée, ses mains tremblant légèrement. « C'était notre trio. Toi, moi... et la personne que tu aimais. » Elle trace du doigt la silhouette absente. « Après l'accident, quelque chose a effacé toute trace de cette personne. Photos, souvenirs, même les sorts de mémoire. Comme si le monde lui-même refusait de s'en souvenir. »\n\nElle te fixe intensément. « Mais cette personne existe toujours. Quelque part. Et elle t'attend. »",
                choices: [
                    { text: "« Pourquoi tout a-t-il été effacé ? »", next: "scene10" },
                    { text: "« Je veux retrouver cette personne »", next: "scene6" }
                ]
            },

            scene6: {
                text: "« Il y a un endroit, » commence Kiki d'une voix grave. « La Bibliothèque des Ombres à Kyoto. Elle contient des grimoires sur la restauration de ce qui a été perdu. Mais le chemin est dangereux. »\n\nLe chat noir bondit du rebord, se transformant en fumée avant de reformer sa silhouette. « Des esprits vengeurs, » dit-il d'une voix rauque. « Des gardiens qui ne laissent passer que ceux dignes de retrouver ce qu'ils ont perdu. Beaucoup y sont entrés. Peu en sont revenus. »",
                choices: [
                    { text: "« Je suis prête à risquer ma vie »", next: "scene11" },
                    { text: "« Il doit y avoir un autre moyen »", next: "scene12" }
                ]
            },

            scene7: {
                text: "Kiki recule d'un pas, serrant le parchemin contre elle. « Non. » Sa voix est ferme. « Si je te le donne maintenant, dans ton état, le choc pourrait te tuer. Les émotions sont de la magie brute, Mara. Tu n'es pas assez forte. »\n\nLe chat noir siffle : « Elle a raison. Tu es une coquille vide. Ce message a été écrit pour Mara, pas pour... ce que tu es devenue. »",
                choices: [
                    { text: "Accepter, même si ça fait mal", next: "scene6" },
                    { text: "« Alors aide-moi à redevenir Mara »", next: "scene9" }
                ]
            },

            scene8: {
                text: "« Un choix, » répond Kiki sombrement. « Si tu veux retrouver tes souvenirs, tu devras affronter ce qui les garde prisonniers. Un gardien. Une ombre née de ton propre désespoir le jour de l'accident. »\n\nElle ouvre un grimoire ancien, révélant des illustrations terrifiantes. « Cette ombre se nourrit de ta peur, de ta douleur. Elle ne te laissera récupérer tes souvenirs que si tu la vaincs. Mais si tu échoues... »\n\n« Tu cesseras d'exister, » conclut le chat.",
                choices: [
                    { text: "« Je l'affronterai »", next: "scene13" },
                    { text: "« Il doit y avoir une autre solution »", next: "scene12" }
                ]
            },

            scene9: {
                text: "Les jours suivants sont brutaux. Kiki t'entraîne sans pitié. Chaque échec est un coup. Chaque succès, une victoire minuscule. Ta magie revient par fragments douloureux.\n\nUn soir, épuisée et couverte de sueur, tu réussis enfin à faire léviter plusieurs objets. Kiki hoche la tête, sans sourire. « C'est un début. Mais ce ne sera pas suffisant pour ce qui vient. »\n\nLe chat apporte un miroir noir. « Regarde-toi. Vois ce que tu es devenue. »",
                choices: [
                    { text: "Regarder dans le miroir", next: "scene14" },
                    { text: "« Je ne veux pas me voir »", next: "scene15" }
                ]
            },

            scene10: {
                text: "« Le rituel que tu as fait, » explique Kiki en allumant des bougies noires, « était censé briser une malédiction. Une malédiction qui condamnait cette personne à être oubliée. Mais tu as échoué. La malédiction s'est renforcée. Maintenant, même toi tu l'as oubliée. »\n\nElle te tend une dague rituelle. « Pour briser ça, tu devras offrir quelque chose de précieux. Du sang. De la souffrance. Ou... »\n\n« Ta vie, » complète le chat.",
                choices: [
                    { text: "« Je donnerai tout ce qu'il faut »", next: "scene11" },
                    { text: "« Il y a forcément un prix moins élevé »", next: "scene12" }
                ]
            },

            scene11: {
                text: "Vous partez pour Kyoto sous un ciel d'orage. Le voyage est silencieux. Kiki ne te regarde pas, perdue dans ses pensées.\n\nLa Forêt des Ombres vous accueille avec hostilité. L'air y est épais, suffocant. Des murmures s'élèvent : des voix de ceux qui ont échoué avant toi.\n\nDevant vous, deux chemins. L'un brille d'une fausse lumière dorée. L'autre est noyé dans l'obscurité absolue.\n\nLe chat gronde : « Choisis avec ton instinct, pas avec tes yeux. »",
                choices: [
                    { text: "Prendre le chemin lumineux", next: "scene16" },
                    { text: "Plonger dans l'obscurité", next: "scene17" }
                ]
            },

            scene12: {
                text: "« Le prix le moins élevé, » dit Kiki amèrement, « c'est le temps. Tu peux attendre. Laisser ta magie revenir naturellement. Laisser les souvenirs se reconstruire seuls. Ça prendra des années. Peut-être des décennies. »\n\nElle se tourne vers toi, les yeux brillants. « Mais chaque jour qui passe, cette personne t'attend. Dans la solitude. Dans la douleur. Oubliée du monde entier, sauf d'elle-même. »\n\nLe silence s'installe, lourd de culpabilité.",
                choices: [
                    { text: "« Je ne peux pas les laisser attendre »", next: "scene11" },
                    { text: "« J'ai besoin de plus de temps pour me préparer »", next: "scene18" }
                ]
            },

            scene13: {
                text: "Kiki te mène à une pièce cachée. Au centre, un cercle de sel noir. « C'est ici que tu l'affronteras. Ton ombre. » Elle hésite, puis ajoute : « Si tu meurs ici, je ne pourrai pas te ramener. »\n\nTu entres dans le cercle. L'air se fige instantanément. L'obscurité s'épaissit, prenant forme.\n\nElle apparaît : une version de toi, déformée, les yeux vides, un sourire cruel. « Tu crois mériter de te souvenir ? » siffle-t-elle. « Tu as tout détruit. »",
                choices: [
                    { text: "« Je me bats pour l'amour »", next: "scene19" },
                    { text: "« Peut-être ai-je tout détruit, mais je peux reconstruire »", next: "scene20" }
                ]
            },

            scene14: {
                text: "Dans le miroir noir, tu te vois. Mais ce n'est pas qu'un reflet. C'est toi, trois semaines plus tôt. Rayonnante. Puissante. Aimante.\n\nPuis l'image change. Tu te vois accomplir le rituel. Tu te vois hurler le nom de quelqu'un. Tu te vois consumer ton essence même dans un dernier effort désespéré.\n\nEt tu te vois échouer.\n\nLes larmes coulent sans que tu puisses les arrêter.",
                choices: [
                    { text: "« Je dois réussir cette fois »", next: "scene13" },
                    { text: "« Montre-moi qui j'essayais de sauver »", next: "scene21" }
                ]
            },

            scene15: {
                text: "« Bien, » dit Kiki froidement. « Parce que si tu te voyais, tu verrais quelqu'un de faible. Quelqu'un qui a abandonné. Quelqu'un qui a trahi l'amour qu'on lui portait. »\n\nSes mots te transpercent comme des lames.\n\n« Mais peut-être, » continue-t-elle d'une voix plus douce, « peut-être que c'est normal d'avoir peur. Peut-être que l'héroïsme, c'est avancer malgré ça. »",
                choices: [
                    { text: "« Tu as raison. Je suis prête maintenant »", next: "scene14" },
                    { text: "« Partons pour Kyoto »", next: "scene11" }
                ]
            },

            scene16: {
                text: "Le chemin lumineux est un piège. Dès que tu y poses le pied, des illusions t'assaillent. Tu vois des visages souriants, des souvenirs heureux qui ne t'appartiennent pas. C'est hypnotique. Séduisant.\n\nKiki te secoue violemment. « Mara ! Ce n'est pas réel ! »\n\nMais tu es déjà perdue dans les faux souvenirs. Le chat crache, dispersant la magie. Tu reviens à toi, tremblante.\n\n« Presque, » murmure-t-il. « Tu as failli te perdre pour toujours. »",
                choices: [
                    { text: "Retourner et prendre l'autre chemin", next: "scene17" },
                    { text: "« Ces souvenirs... ils semblaient si réels »", next: "scene22" }
                ]
            },

            scene17: {
                text: "L'obscurité t'engloutit. Pas de lumière. Pas de repères. Juste le vide. Ta peur monte, mais tu continues.\n\nPuis, dans le noir, tu sens une présence. Chaleureuse. Familière. Une main invisible frôle la tienne, comme pour te guider.\n\nKiki murmure : « Quelqu'un veille sur toi, même ici. »\n\nVous émergez enfin dans une clairière. La Bibliothèque des Ombres se dresse devant vous, immense et menaçante.",
                choices: [
                    { text: "Entrer dans la bibliothèque", next: "scene23" },
                    { text: "« Qui était avec moi dans l'obscurité ? »", next: "scene24" }
                ]
            },

            scene18: {
                text: "Tu passes une semaine à te préparer. Kiki t'enseigne des sorts de protection, mais chaque leçon te rappelle ce que tu as perdu. Tu n'es qu'une ombre de ce que tu étais.\n\nLa veille du départ, tu rêves. Un rêve vivide. Quelqu'un te parle : « N'abandonne pas, Mara. Je t'attends. J'attendrai toujours. »\n\nTu te réveilles en larmes, le cœur brisé par une douleur que tu ne comprends pas.",
                choices: [
                    { text: "Partir immédiatement pour Kyoto", next: "scene11" },
                    { text: "« Kiki, quelqu'un me parle dans mes rêves »", next: "scene25" }
                ]
            },

            scene19: {
                text: "Ton ombre ricane. « L'amour ? Tu ne te souviens même pas de cette personne ! Comment peux-tu te battre pour quelque chose que tu as oublié ? »\n\nMais au fond de toi, quelque chose résonne. Un sentiment. Pas un souvenir, mais quelque chose de plus profond. De plus vrai.\n\n« Je me bats parce que même si je ne me souviens pas, mon cœur se souvient. »\n\nL'ombre hurle, se dissolvant dans la lumière qui émane soudain de ta poitrine.",
                choices: [
                    { text: "Saisir les souvenirs qui se déversent", next: "scene26" }
                ]
            },

            scene20: {
                text: "L'ombre hésite. « Reconstruire ? » Elle rit amèrement. « Avec quoi ? Tu n'es rien. Juste un fantôme de toi-même. »\n\n« Peut-être, » réponds-tu. « Mais même les fantômes peuvent hanter. Peuvent persister. Peuvent refuser de disparaître. »\n\nTa détermination crée une fissure dans l'ombre. Elle recule, surprise. Tu avances, pas à pas, jusqu'à ce qu'elle ne soit plus qu'un murmure.\n\n« Tu as gagné... pour l'instant, » siffle-t-elle avant de disparaître.",
                choices: [
                    { text: "Récupérer tes souvenirs", next: "scene26" }
                ]
            },

            scene21: {
                text: "Le miroir noir s'assombrit davantage. Puis, lentement, une silhouette apparaît. Floue. Indistincte. Mais la sensation qu'elle provoque est écrasante.\n\nAmour. Confiance. Chaleur.\n\nTu tends la main vers le miroir. La silhouette fait de même. Vos doigts se touchent presque...\n\nLe miroir explose.\n\nTu reprends conscience, le parchemin scellé dans ta main. Comment est-il arrivé là ?",
                choices: [
                    { text: "Briser le sceau", next: "scene27" }
                ]
            },

            scene22: {
                text: "« C'est la cruauté de cet endroit, » explique Kiki. « Il te montre ce que tu désires le plus : des souvenirs, même faux. Beaucoup y restent piégés pour toujours, vivant dans des mensonges. »\n\nLe chat ajoute : « La vérité fait mal. Les mensonges réconfortent. C'est pour ça que tant de gens les choisissent. »\n\nTu regardes vers le chemin sombre. C'est là que se trouve la vérité.",
                choices: [
                    { text: "Affronter l'obscurité", next: "scene17" }
                ]
            },

            scene23: {
                text: "L'intérieur de la bibliothèque est vertigineux. Des grimoires flottent dans les airs, certains en flammes, d'autres couverts de givre. Un bibliothécaire spectral apparaît.\n\n« Pourquoi es-tu venue, sorcière brisée ? » Sa voix résonne dans tout l'espace.\n\n« Pour retrouver ce que j'ai perdu. »\n\nIl rit, un son creux. « Ce que tu cherches n'est pas dans les livres. C'est en toi. Toujours été en toi. Tu dois juste avoir le courage de le regarder en face. »",
                choices: [
                    { text: "« Alors aide-moi à voir »", next: "scene26" }
                ]
            },

            scene24: {
                text: "Kiki te regarde avec une expression étrange. « Celui ou celle que tu as essayé de sauver. Cette personne est liée à toi d'une manière que la magie elle-même ne peut briser. Même oubliée, même effacée, cette connexion persiste. »\n\nLe chat se frotte contre ta jambe. « Les vrais liens survivent à tout. Même à l'oubli. »",
                choices: [
                    { text: "Entrer dans la bibliothèque avec une détermination renouvelée", next: "scene23" }
                ]
            },

            scene25: {
                text: "« C'est cette personne, » dit Kiki doucement. « Elle utilise les derniers fragments de magie qui vous lient pour te parler. Chaque nuit. Te guidant. T'encourageant. Même si tu ne peux pas répondre. »\n\nElle sort le parchemin scellé. « Elle t'a écrit ceci avant que tout n'arrive. Comme une assurance. Au cas où... »\n\nSa voix se brise.\n\n« Au cas où elle te perdrait. »",
                choices: [
                    { text: "Prendre le parchemin", next: "scene27" }
                ]
            },

            scene26: {
                text: "Les souvenirs déferlent comme un raz-de-marée. Pas tous. Pas encore. Mais suffisamment.\n\nTu te souviens de rires partagés. De regards complices. De mains enlacées. D'une voix qui disait : « Tu peux le faire, Mara. Je crois en toi. »\n\nTu te souviens d'avoir tout risqué pour sauver cette personne d'une malédiction. D'avoir échoué. D'avoir perdu.\n\nEt tu te souviens d'un dernier murmure avant de sombrer : « Je t'aime. »\n\nKiki te tend le parchemin. « Il est temps. »",
                choices: [
                    { text: "Ouvrir le message avec des mains tremblantes", next: "scene27" },
                    { text: "« Attends... laisse-moi savourer ces souvenirs un instant »", next: "scene27" }
                ]
            },

            scene27: {
                text: "Tes mains tremblent en brisant le sceau de cire noire. Le parchemin se déroule, révélant une écriture élégante mais tremblante, comme écrite dans l'urgence et l'émotion...",
                choices: [
                    { text: "Lire", next: "scene28" }
                ]
            },

            scene28: {
                text: "« Mara,\n\nSi tu lis ceci, c'est que tu es revenue. Peut-être changée. Peut-être brisée. Mais vivante.\n\nJe ne sais pas combien de temps s'est écoulé. Jours ? Semaines ? Le temps n'a plus de sens sans toi. La malédiction qui m'efface persiste, mais elle ne pourra jamais effacer ce que je ressens.\n\nTu as tout risqué pour me sauver. Tu as échoué. Mais ton courage, ton sacrifice... c'était la chose la plus belle que quelqu'un ait jamais faite pour moi. »",
                choices: [
                    { text: "Continuer à lire", next: "scene29" }
                ]
            },

            scene29: {
                text: "« Je t'ai observée pendant ton sommeil. J'ai parlé dans tes rêves. J'ai utilisé chaque once de magie qu'il me restait pour te guider, même si tu ne pouvais pas me voir, même si le monde m'avait oubliée.\n\nParce que c'est ça, l'amour véritable. Ça persiste. Même dans l'obscurité. Même dans l'oubli. Même quand tout espoir semble perdu. »",
                choices: [
                    { text: "Lire la fin, des larmes coulant sur tes joues", next: "scene30" }
                ]
            },

            scene30: {
                text: "« Alors maintenant, Mara, je te pose la question que j'ai portée dans mon cœur à travers toute cette nuit sans fin :\n\nVeux-tu être ma Valentine ?\n\nPas seulement aujourd'hui. Mais pour tous nos lendemains. Dans la lumière et dans l'ombre. Dans le souvenir et dans l'oubli. Pour toutes les batailles à venir, tous les sorts que nous lancerons, toutes les tempêtes que nous traverserons.\n\nJe t'aime. Pas malgré l'obscurité, mais avec elle.\n\nÉternellement tienne. »",
                choices: [
                    { text: "« Oui. Mille fois oui. »", next: "happy_ending" },
                    { text: "Serrer le parchemin contre ton cœur en pleurant", next: "happy_ending" }
                ]
            },

            scene31: {
                text: "Tu te concentres sur la plume. « LEVITAS. » Ta voix résonne, incertaine.\n\nLa plume tremble... puis s'élève doucement, vacillant dans l'air comme une feuille morte. Kiki sourit faiblement. « Bien. Mais c'est fragile. Ta magie est comme un muscle atrophié. »\n\nLe chat gronde : « Maintenant, le vrai test. Fais léviter quelque chose de plus lourd. »",
                choices: [
                    { text: "Tenter de faire léviter un livre", next: "scene33" },
                    { text: "« Non, je dois d'abord maîtriser ça »", next: "scene34" }
                ]
            },

            scene32: {
                text: "« IGNIS MINOR ! » cries-tu, la main tendue vers la bougie.\n\nUne étincelle jaillit... puis une flamme. Mais elle grandit. Trop vite. Trop fort. La bougie devient un brasier.\n\nKiki hurle une contre-formule : « AQUA EXTINCTUS ! » L'eau magique éteint les flammes.\n\n« C'est exactement ce que je craignais, » dit-elle sombrement. « Ta magie est instable. Chaque sort est un risque. »",
                choices: [
                    { text: "« Apprends-moi à mieux contrôler »", next: "scene35" },
                    { text: "« Peut-être que je devrais essayer un autre sort »", next: "scene31" }
                ]
            },

            scene33: {
                text: "Tu fixes le grimoire sur la table. « LEVITAS ! » dis-tu avec plus de force.\n\nLe livre s'élève... mais ta concentration faiblit. Il vacille dangereusement au-dessus de Kiki.\n\n« Mara ! Contrôle ! » crie-t-elle.\n\nTu dois choisir rapidement.",
                choices: [
                    { text: "Forcer ta magie pour maintenir le contrôle", next: "scene36" },
                    { text: "Lâcher prise et laisser tomber le livre", next: "scene37" }
                ]
            },

            scene34: {
                text: "Sage décision. Tu passes des heures à faire léviter la plume, encore et encore. La fatigue te gagne, mais tu persistes.\n\nKiki observe en silence. « Tu apprends la patience. C'est bien. Beaucoup de sorcières meurent jeunes par impatience. »\n\nLe chat ronronne : « Maintenant que tu as les bases, il est temps de parler du balai. »",
                choices: [
                    { text: "« Je suis prête à voler »", next: "scene38" },
                    { text: "« Apprends-moi d'abord d'autres sorts »", next: "scene35" }
                ]
            },

            scene35: {
                text: "Kiki t'enseigne une technique de respiration. « La magie vient du centre de ton être. Respire. Ancre-toi. Puis libère. »\n\nElle te fait répéter : « IGNIS MINOR. » Cette fois, une petite flamme parfaite danse sur ton doigt. Contrôlée. Maîtrisée.\n\n« Voilà, » dit-elle avec fierté. « C'est toi. La vraie Mara commence à revenir. »",
                choices: [
                    { text: "« Maintenant, le balai ? »", next: "scene38" },
                    { text: "« Je veux apprendre VENTUS »", next: "scene39" }
                ]
            },

            scene36: {
                text: "Tu serres les dents et forces. « LEVITAS ! » hurles-tu.\n\nLe livre se stabilise... mais l'effort est trop grand. Du sang coule de ton nez. Ta vision se trouble. Tu t'effondres.\n\nQuand tu reprends conscience, Kiki est penchée sur toi, terrifiée. « Tu aurais pu te tuer, idiote ! La magie a un prix ! »",
                choices: [
                    { text: "« Je... je suis désolée »", next: "scene40" },
                    { text: "« Mais j'ai réussi, non ? »", next: "scene40" }
                ]
            },

            scene37: {
                text: "Tu lâches prise. Le livre tombe, manquant de peu le pied de Kiki. Elle soupire, soulagée.\n\n« Bien choisi. Mieux vaut échouer que mourir d'arrogance. » Elle ramasse le livre. « La magie n'est pas une compétition. C'est une conversation. »\n\nLe chat saute sur tes genoux : « Tu apprends. C'est bon signe. »",
                choices: [
                    { text: "Continuer l'entraînement avec prudence", next: "scene34" },
                    { text: "« Parle-moi du balai maintenant »", next: "scene38" }
                ]
            },

            scene38: {
                text: "Kiki prend le balai ancien, ses runes brillant faiblement. « Voler, c'est faire confiance. Au balai. À la magie. À toi-même. » Elle te le tend.\n\n« Le sort d'activation est : VOLATUS ASCENDO. Mais attention. Si tu perds ta concentration en vol... » Elle laisse la menace en suspens.\n\nLe balai vibre dans tes mains, reconnaissant quelque chose en toi.",
                choices: [
                    { text: "Prononcer le sort immédiatement", next: "scene41" },
                    { text: "« D'abord, montre-moi comment tu voles »", next: "scene42" }
                ]
            },

            scene39: {
                text: "« VENTUS, » dis-tu en tendant la main.\n\nUn vent glacial surgit, faisant voler les pages du grimoire. Kiki doit le plaquer contre la table. « Trop puissant ! » crie-t-elle. « Concentre ! »\n\nTu essaies de réduire l'intensité, mais le vent devient tempête. Les fenêtres tremblent.",
                choices: [
                    { text: "Crier « FINIS ! » pour tout arrêter", next: "scene43" },
                    { text: "Essayer de chevaucher la tempête", next: "scene44" }
                ]
            },

            scene40: {
                text: "Kiki t'aide à te relever. « Écoute-moi bien. Chaque sort que tu lances consomme ton énergie vitale. Si tu forces trop, tu meurs. C'est aussi simple que ça. »\n\nElle pose sa main sur ton épaule. « Je ne veux pas te perdre aussi. Pas après... » Elle ne finit pas.\n\nLe silence pèse lourd entre vous.",
                choices: [
                    { text: "« Aussi ? Qui d'autre as-tu perdu ? »", next: "scene45" },
                    { text: "« Je serai plus prudente, promis »", next: "scene34" }
                ]
            },

            scene41: {
                text: "« VOLATUS ASCENDO ! » cries-tu avec détermination.\n\nLe balai bondit violemment sous toi. Tu t'envoles... mais sans contrôle ! Tu montes trop vite, trop haut. Le sol s'éloigne à une vitesse terrifiante.\n\nKiki hurle en bas : « RALENTIS ! Le contre-sort ! VOLATUS LENTUS ! »\n\nMais peux-tu le prononcer en pleine panique ?",
                choices: [
                    { text: "Essayer de crier « VOLATUS LENTUS ! »", next: "scene46" },
                    { text: "Sauter du balai avant qu'il soit trop tard", next: "death2" }
                ]
            },

            scene42: {
                text: "Kiki prend son propre balai, plus petit et orné de symboles argentés. « Regarde bien. » Elle prononce la formule avec grâce : « VOLATUS ASCENDO. »\n\nElle s'élève doucement, contrôlant chaque mouvement. Elle vole en cercles, monte, descend, pivote. C'est hypnotique.\n\n« Tu vois ? C'est une danse. Pas un combat. » Elle atterrit délicatement.",
                choices: [
                    { text: "« Je veux essayer maintenant »", next: "scene47" },
                    { text: "« Enseigne-moi d'abord les contre-sorts de sécurité »", next: "scene48" }
                ]
            },

            scene43: {
                text: "« FINIS ! » hurles-tu de toutes tes forces.\n\nLa tempête s'arrête net. Trop net. Le contrecoup te projette contre le mur. Tu glisses au sol, sonnée.\n\nKiki accourt. « Les contre-sorts ont leur propre danger. Tu dois apprendre à doser. » Elle t'aide, inquiète.\n\n« Assez pour aujourd'hui. Tu as besoin de repos. »",
                choices: [
                    { text: "Accepter et te reposer", next: "scene49" },
                    { text: "« Non, encore un sort. Je dois progresser »", next: "scene50" }
                ]
            },

            scene44: {
                text: "Au lieu de lutter, tu danses avec le vent. Tu le sens, tu le comprends. Il tourbillonne autour de toi, mais ne te fait pas mal.\n\nKiki te regarde, bouche bée. « Tu... tu viens de faire quelque chose d'incroyable. Tu as communié avec la magie brute. »\n\nLe vent se calme de lui-même, devenant une brise douce.",
                choices: [
                    { text: "« C'était... magnifique »", next: "scene51" },
                    { text: "« Est-ce que je faisais ça avant ? »", next: "scene52" }
                ]
            },

            scene45: {
                text: "Kiki détourne le regard, ses yeux brillants. « La personne que tu as essayé de sauver... elle était tout pour moi aussi. Mon meilleur ami. Mon confident. » Sa voix se brise.\n\n« Quand tu as échoué... j'ai perdu deux personnes ce jour-là. Toi à l'amnésie. Et... l'autre à l'oubli. »\n\nLes larmes coulent sur ses joues.",
                choices: [
                    { text: "La prendre dans tes bras", next: "scene53" },
                    { text: "« Alors aidons-nous mutuellement à tout retrouver »", next: "scene54" }
                ]
            },

            scene46: {
                text: "« VOLATUS LENTUS ! » cries-tu, ta voix tremblante de peur.\n\nLe balai ralentit... mais pas assez vite. Tu perds l'équilibre et glisses. Tu tombes.\n\nKiki hurle : « PLUMA CORPORIS ! »\n\nTon corps devient léger comme une plume. Tu atterris doucement, tremblante mais vivante. Kiki te serre dans ses bras. « Jamais... plus jamais sans préparation ! »",
                choices: [
                    { text: "« Je suis désolée... »", next: "scene55" },
                    { text: "« Au moins maintenant je connais le sort de chute »", next: "scene55" }
                ]
            },

            scene47: {
                text: "Tu montes sur ton balai. Tu respires profondément. « VOLATUS ASCENDO, » dis-tu calmement.\n\nLe balai s'élève. Lentement. Contrôlé. Tu es à un mètre du sol. Puis deux. La sensation est indescriptible.\n\nKiki applaudit : « Oui ! Comme ça ! Maintenant, reste stable ! »",
                choices: [
                    { text: "Maintenir l'altitude et savourer le moment", next: "scene56" },
                    { text: "Essayer de monter plus haut", next: "scene57" }
                ]
            },

            scene48: {
                text: "Kiki te fait mémoriser trois formules essentielles :\n\n« VOLATUS LENTUS » - Pour ralentir\n« VOLATUS CESSUS » - Pour arrêter complètement\n« PLUMA CORPORIS » - Sort de chute de secours\n\n« Ces trois sorts peuvent te sauver la vie, » dit-elle gravement. « Répète-les jusqu'à ce qu'ils deviennent instinct. »",
                choices: [
                    { text: "Pratiquer les formules jusqu'à les maîtriser", next: "scene58" },
                    { text: "« Je les connais. Volons maintenant »", next: "scene47" }
                ]
            },

            scene49: {
                text: "Cette nuit-là, tu rêves. Tu voles au-dessus d'Osaka, mais tu n'es pas seule. Quelqu'un vole à tes côtés, riant, criant de joie.\n\nVous faites la course entre les gratte-ciels. Vous dansez dans les nuages. C'est le bonheur pur.\n\nTu te réveilles en larmes, le cœur serré par un manque que tu ne comprends pas.",
                choices: [
                    { text: "Raconter le rêve à Kiki", next: "scene59" },
                    { text: "Garder le rêve pour toi et méditer dessus", next: "scene60" }
                ]
            },

            scene50: {
                text: "« Têtue comme toujours, » marmonne Kiki, mais elle sourit faiblement. « Très bien. Un dernier sort. SANCTUM PROTECTUS - le bouclier protecteur. »\n\nElle dessine un cercle de craie autour de toi. « Dis les mots, et un bouclier magique t'entourera. Mais s'il se brise... le contrecoup peut être mortel. »",
                choices: [
                    { text: "« SANCTUM PROTECTUS ! »", next: "scene61" },
                    { text: "« Finalement, peut-être que je devrais me reposer »", next: "scene49" }
                ]
            },

            scene51: {
                text: "Kiki s'agenouille devant toi. « C'était ton talent unique. Tu ne commandais pas la magie. Tu la comprenais. Tu lui parlais. » Elle te prend les mains.\n\n« C'est pour ça que cette personne croyait en toi. Parce que ta magie venait du cœur, pas de l'ego. »",
                choices: [
                    { text: "« Parle-moi de cette personne »", next: "scene3" },
                    { text: "« Je veux voler maintenant »", next: "scene38" }
                ]
            },

            scene52: {
                text: "« Oui, » murmure Kiki avec nostalgie. « Tu dansais avec les tempêtes. Tu chevauchais les tornades. C'était terrifiant et magnifique. » Elle sourit tristement.\n\n« Cette personne te regardait toujours voler. Avec une admiration... et un amour que je n'avais jamais vus chez personne. »",
                choices: [
                    { text: "Sentir ton cœur se serrer", next: "scene3" },
                    { text: "« Alors je dois réapprendre à voler »", next: "scene38" }
                ]
            },

            scene53: {
                text: "Tu l'enlaces. Elle pleure dans tes bras. « Je suis tellement fatiguée de faire semblant d'être forte, » sanglote-t-elle. « Je veux juste... je veux juste que tout redevienne comme avant. »\n\nVous restez ainsi longtemps, partageant votre douleur.",
                choices: [
                    { text: "« Nous allons tout récupérer. Ensemble »", next: "scene54" },
                    { text: "« Repose-toi. Je veille sur toi ce soir »", next: "scene49" }
                ]
            },

            scene54: {
                text: "Kiki essuie ses larmes. « Tu as raison. Assez pleuré sur le passé. Il est temps d'agir. » Elle se lève avec détermination.\n\n« Pour aller à Kyoto, tu devras voler. Le voyage en balai est le plus sûr. Mais d'abord... tu dois maîtriser le vol. »",
                choices: [
                    { text: "« Alors entraînons-nous »", next: "scene38" },
                    { text: "« Partons demain. Je suis prête »", next: "scene62" }
                ]
            },

            scene55: {
                text: "Kiki te tient fermement. « Tu as de la chance d'être vivante. Le vol n'est pas un jeu. » Elle regarde le balai avec méfiance.\n\n« Mais... tu as réussi à invoquer le sort de ralentissement en pleine chute. C'est remarquable. Ton instinct revient. »",
                choices: [
                    { text: "« Je veux réessayer, mais lentement »", next: "scene47" },
                    { text: "« Peut-être que je devrais d'abord maîtriser d'autres sorts »", next: "scene35" }
                ]
            },

            scene56: {
                text: "Tu restes stable, savourant la sensation de liberté. Le vent dans tes cheveux. La légèreté. C'est comme si ton corps se souvenait, même si ton esprit ne le peut pas.\n\nKiki vole à tes côtés sur son balai. « Tu te débrouilles bien. Maintenant, essaie de te déplacer latéralement. »",
                choices: [
                    { text: "Incliner doucement le balai vers la gauche", next: "scene63" },
                    { text: "« Atterrissons d'abord. Je veux consolider »", next: "scene64" }
                ]
            },

            scene57: {
                text: "Tu forces le balai à monter. Plus haut. Toujours plus haut. L'adrénaline pulse dans tes veines.\n\nSoudain, le vent change. Une bourrasque te frappe de côté. Tu perds le contrôle !\n\nKiki hurle : « STABILISE-TOI ! »",
                choices: [
                    { text: "« VOLATUS CESSUS ! » pour tout arrêter", next: "scene65" },
                    { text: "Essayer de chevaucher le vent comme avant", next: "scene66" }
                ]
            },

            scene58: {
                text: "Tu passes une heure à répéter les formules. « VOLATUS LENTUS. VOLATUS CESSUS. PLUMA CORPORIS. » Encore et encore. Jusqu'à ce que les mots coulent naturellement.\n\nKiki hoche la tête, satisfaite. « Bien. Maintenant, tu es prête pour un vrai vol. »",
                choices: [
                    { text: "Monter sur le balai avec confiance", next: "scene47" },
                    { text: "« D'abord, parle-moi des dangers du vol »", next: "scene67" }
                ]
            },

            scene59: {
                text: "Tu racontes ton rêve. Kiki écoute, les yeux fermés, un sourire douloureux sur les lèvres.\n\n« Ce n'était pas qu'un rêve, Mara. C'était un souvenir. Vous voliez ensemble tout le temps. C'était... votre truc. » Elle ouvre les yeux, brillants de larmes.\n\n« Cette personne t'attend toujours. Quelque part dans l'ombre. »",
                choices: [
                    { text: "« Alors allons à Kyoto. Maintenant »", next: "scene62" },
                    { text: "« J'ai besoin d'en savoir plus d'abord »", next: "scene3" }
                ]
            },

            scene60: {
                text: "Tu médites sur le rêve, laissant les émotions t'envahir. Joie. Liberté. Amour. Ces sentiments résonnent profondément en toi.\n\nLe chat noir saute sur ton lit. « Les rêves sont des fenêtres sur ce que nous avons perdu, » dit-il doucement. « Continue à chercher. »",
                choices: [
                    { text: "Décider de partir pour Kyoto", next: "scene62" },
                    { text: "Continuer l'entraînement magique d'abord", next: "scene35" }
                ]
            },

            scene61: {
                text: "« SANCTUM PROTECTUS ! » cries-tu.\n\nUne bulle de lumière bleutée t'entoure. C'est magnifique. Kiki lance des sorts mineurs pour tester. Ton bouclier tient bon !\n\nPuis elle lance quelque chose de plus fort. Le bouclier craque. Des fissures apparaissent.\n\n« ARRÊTE LE SORT ! » hurle-t-elle. « Dis FINIS ou il va exploser ! »",
                choices: [
                    { text: "« FINIS ! » immédiatement", next: "scene68" },
                    { text: "Essayer de renforcer le bouclier", next: "death3" }
                ]
            },

            scene62: {
                text: "« Kyoto est à plusieurs heures de vol, » dit Kiki en préparant des provisions. « Nous devrons traverser la Forêt des Ombres. Des courants magiques dangereux. Des créatures hostiles. »\n\nElle te tend ton balai. « Es-tu vraiment prête ? »",
                choices: [
                    { text: "« Je suis prête. Partons »", next: "scene11" },
                    { text: "« Attendons demain. Une dernière nuit de préparation »", next: "scene18" }
                ]
            },

            scene63: {
                text: "Tu inclines doucement. Le balai répond avec grâce. Tu glisses latéralement, sentant le vent te porter.\n\nKiki applaudit : « Parfait ! Tu as le contrôle ! Maintenant, essaie un virage complet. »\n\nTon cœur bat d'excitation.",
                choices: [
                    { text: "Tenter le virage avec confiance", next: "scene69" },
                    { text: "« Je préfère atterrir sur un succès »", next: "scene64" }
                ]
            },

            scene64: {
                text: "Tu prononces doucement : « VOLATUS LENTUS. » Tu descends en douceur, atterrissant avec grâce.\n\nKiki te serre dans ses bras. « Tu as été prudente et sage. C'est comme ça qu'on survit en tant que sorcière. »\n\nLe chat ronronne : « Prête pour le vrai voyage maintenant ? »",
                choices: [
                    { text: "« Oui. Allons à Kyoto »", next: "scene62" },
                    { text: "« Encore un peu d'entraînement d'abord »", next: "scene35" }
                ]
            },

            scene65: {
                text: "« VOLATUS CESSUS ! » hurles-tu.\n\nLe balai s'arrête net. Trop net. Tu es propulsée en avant, perdant l'équilibre. Tu tombes.\n\n« PLUMA CORPORIS ! » cries-tu instinctivement.\n\nTon corps devient léger. Tu atterris en roulant, choquée mais indemne. Kiki accourt, impressionnée. « Tu as utilisé deux sorts de sécurité en succession. Bien joué ! »",
                choices: [
                    { text: "« Mon instinct prend le dessus »", next: "scene64" },
                    { text: "« Je veux réessayer immédiatement »", next: "scene47" }
                ]
            },

            scene66: {
                text: "Au lieu de lutter, tu te laisses porter par le vent. Tu danses avec lui, comme lors de ton sort VENTUS.\n\nLe balai devient une extension de toi. Tu vires, tu plonges, tu remontes. C'est du pur instinct.\n\nKiki te regarde, émerveillée. « Tu as retrouvé ton don, Mara. Tu es redevenue toi-même. »",
                choices: [
                    { text: "Atterrir avec grâce, le cœur battant", next: "scene70" },
                    { text: "Continuer à voler, testing tes limites", next: "scene71" }
                ]
            },

            scene67: {
                text: "« Les bourrasques magiques, » explique Kiki, « peuvent te faire tomber en un instant. Les créatures volantes peuvent attaquer. Et si tu tombes de trop haut sans le sort PLUMA CORPORIS... »\n\nElle ne finit pas. L'implication est claire.\n\n« Mais le pire, c'est la fatigue. Un long vol épuise ton énergie magique. Si tu t'épuises en vol... tu tombes. »",
                choices: [
                    { text: "« Je comprends les risques. Volons »", next: "scene47" },

        let currentScene = 'start';
        let visitedScenes = new Set();

        function displayScene(sceneId) {
            if (!scenes[sceneId]) {
                console.error('Scène introuvable:', sceneId);
                displayScene('start');
                return;
            }

            currentScene = sceneId;
            visitedScenes.add(sceneId);
            
            const scene = scenes[sceneId];
            const content = document.getElementById('game-content');
            
            if (sceneId === 'start') {
                content.innerHTML = `
                    <div class="start-screen">
                        <h1 class="title">Les Ombres Oubliées</h1>
                        <p class="subtitle">Un récit de magie, de perte et de rédemption</p>
                        <p class="scene-text">${scene.text}</p>
                        <button class="start-btn" onclick="displayScene('scene1')">
                            Entrer dans l'ombre
                        </button>
                    </div>
                `;
            } else if (scene.choices.length === 0) {
                content.innerHTML = `
                    <div class="final-scroll">
                        <p class="scene-text">${scene.text}</p>
                    </div>
                `;
            } else if (sceneId.startsWith('death')) {
                content.innerHTML = `
                    <div class="death-screen">
                        <h2 class="death-title">💀</h2>
                        <p class="scene-text">${scene.text}</p>
                        <button class="restart-btn" onclick="displayScene('start')">Recommencer</button>
                    </div>
                `;
            } else {
                const sceneNumber = visitedScenes.size;
                let choicesHTML = '<div class="choices">';
                scene.choices.forEach((choice) => {
                    choicesHTML += `<button class="choice-btn" onclick="displayScene('${choice.next}')">${choice.text}</button>`;
                });
                choicesHTML += '</div>';
                
                content.innerHTML = `
                    <div class="scene-number">Chapitre ${sceneNumber}</div>
                    <p class="scene-text">${scene.text}</p>
                    ${choicesHTML}
                `;
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        displayScene('start');
    </script>
