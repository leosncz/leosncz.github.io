<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une Histoire pour Mara 💫</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

    :root {
        --night-sky: #0a0e27;
        --deep-purple: #1a1441;
        --magic-pink: #ff6b9d;
        --soft-gold: #ffd89b;
        --moon-white: #f8f9fa;
        --star-blue: #4ec5d4;
        --shadow: rgba(0, 0, 0, 0.4);
    }

    body {
        font-family: 'Crimson Pro', serif;
        background: linear-gradient(135deg, var(--night-sky) 0%, var(--deep-purple) 100%);
        color: var(--moon-white);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
    }

    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
    }

    .container {
        position: relative;
        z-index: 1;
        max-width: 700px;
        margin: 0 auto;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .game-card {
        background: rgba(26, 20, 65, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 20px 60px var(--shadow), 
                    inset 0 0 0 1px rgba(255, 255, 255, 0.1);
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .title {
        font-family: 'Montserrat', sans-serif;
        font-size: 2.2em;
        font-weight: 700;
        text-align: center;
        margin-bottom: 15px;
        background: linear-gradient(135deg, var(--magic-pink), var(--soft-gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.3); }
    }

    .subtitle {
        text-align: center;
        color: var(--star-blue);
        font-size: 1.1em;
        margin-bottom: 30px;
        opacity: 0.9;
    }

    .scene-text {
        font-size: 1.2em;
        line-height: 1.8;
        margin-bottom: 30px;
        text-align: justify;
        color: var(--moon-white);
        opacity: 0;
        animation: textAppear 0.6s ease-out 0.2s forwards;
    }

    @keyframes textAppear {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .choices {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .choice-btn {
        background: linear-gradient(135deg, rgba(78, 197, 212, 0.2), rgba(255, 107, 157, 0.2));
        border: 2px solid var(--magic-pink);
        color: var(--moon-white);
        padding: 18px 25px;
        border-radius: 15px;
        font-family: 'Crimson Pro', serif;
        font-size: 1.1em;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: left;
        position: relative;
        overflow: hidden;
        opacity: 0;
        animation: choiceAppear 0.5s ease-out forwards;
    }

    .choice-btn:nth-child(1) { animation-delay: 0.3s; }
    .choice-btn:nth-child(2) { animation-delay: 0.4s; }
    .choice-btn:nth-child(3) { animation-delay: 0.5s; }

    @keyframes choiceAppear {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
    }

    .choice-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }

    .choice-btn:hover::before {
        left: 100%;
    }

    .choice-btn:hover {
        background: linear-gradient(135deg, rgba(78, 197, 212, 0.4), rgba(255, 107, 157, 0.4));
        border-color: var(--soft-gold);
        transform: translateX(10px) scale(1.02);
        box-shadow: 0 10px 30px rgba(255, 107, 157, 0.3);
    }

    .choice-btn:active {
        transform: translateX(10px) scale(0.98);
    }

    .start-screen {
        text-align: center;
    }

    .start-btn {
        background: linear-gradient(135deg, var(--magic-pink), var(--soft-gold));
        border: none;
        color: var(--night-sky);
        padding: 20px 50px;
        border-radius: 50px;
        font-family: 'Montserrat', sans-serif;
        font-size: 1.3em;
        font-weight: 700;
        cursor: pointer;
        margin-top: 30px;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(255, 107, 157, 0.5);
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    .start-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 15px 40px rgba(255, 107, 157, 0.7);
    }

    .scene-number {
        text-align: center;
        color: var(--star-blue);
        font-size: 0.9em;
        margin-bottom: 20px;
        opacity: 0.7;
    }

    .death-screen {
        text-align: center;
    }

    .death-title {
        font-size: 2em;
        color: var(--magic-pink);
        margin-bottom: 20px;
    }

    .restart-btn {
        background: linear-gradient(135deg, var(--star-blue), var(--magic-pink));
        border: none;
        color: white;
        padding: 15px 40px;
        border-radius: 30px;
        font-family: 'Montserrat', sans-serif;
        font-size: 1.1em;
        cursor: pointer;
        margin-top: 20px;
        transition: all 0.3s ease;
    }

    .restart-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(78, 197, 212, 0.5);
    }

    .final-scroll {
        background: rgba(255, 217, 155, 0.1);
        border: 3px solid var(--soft-gold);
        border-radius: 15px;
        padding: 30px;
        margin: 20px 0;
        text-align: center;
        box-shadow: 0 0 30px rgba(255, 217, 155, 0.3);
    }

    .final-message {
        font-size: 1.5em;
        color: var(--soft-gold);
        font-weight: 600;
        margin-bottom: 15px;
        animation: glow 2s infinite;
    }

    @keyframes glow {
        0%, 100% { text-shadow: 0 0 10px rgba(255, 217, 155, 0.5); }
        50% { text-shadow: 0 0 20px rgba(255, 217, 155, 0.8); }
    }

    @media (max-width: 600px) {
        .container {
            padding: 15px;
        }

        .game-card {
            padding: 30px 20px;
        }

        .title {
            font-size: 1.8em;
        }

        .scene-text {
            font-size: 1.05em;
        }

        .choice-btn {
            padding: 15px 20px;
            font-size: 1em;
        }
    }
</style>

</head>
<body>
    <div class="stars" id="stars"></div>

<div class="container">
    <div class="game-card">
        <div id="game-content"></div>
    </div>
</div>

<script>
    function createStars() {
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }
    }

    createStars();

    const scenes = {
        start: {
            text: "Dans une petite maison nichée au cœur d'Osaka, les premiers rayons du soleil caressent ton visage. Tes yeux s'ouvrent lentement... mais quelque chose ne va pas. Ton esprit est vide, comme un livre dont toutes les pages auraient été arrachées. Tu ne te souviens de rien.\n\nUne voix douce résonne : « Mara ? Tu es réveillée ? » Une jeune fille aux cheveux roux apparaît, un grand chat noir sur son épaule. « Je suis Kiki, et voici Jiji. Tu es en sécurité ici. »",
            choices: [
                { text: "« Qui suis-je ? Pourquoi je ne me souviens de rien ? »", next: "scene1" },
                { text: "« Un chat qui parle ? Je rêve encore... »", next: "scene2" },
                { text: "Rester silencieuse et observer", next: "scene3" }
            ]
        },

        scene1: {
            text: "Kiki s'assoit près de toi avec douceur. « Tu es Mara, une apprentie sorcière. Il y a trois jours, tu as tenté un sort trop puissant pour restaurer les souvenirs d'un phénix blessé. L'explosion magique a fait exploser ta propre mémoire en éclats. » Elle prend ta main avec tendresse. « Mais nous allons t'aider à tout retrouver, morceau par morceau. »\n\nJiji bondit sur le lit : « La magie est comme faire du vélo, ça ne s'oublie jamais vraiment ! Enfin... j'espère. »",
            choices: [
                { text: "« Montrez-moi ce que je sais faire ! »", next: "scene4" },
                { text: "« Sommes-nous amies depuis longtemps ? »", next: "scene5" },
                { text: "« Comment puis-je récupérer ma mémoire ? »", next: "scene6" }
            ]
        },

        scene2: {
            text: "Jiji te fixe avec ses grands yeux dorés : « Non, tu ne rêves pas. Je suis un familier magique, gardien des sorcières depuis des siècles. » Il ronronne légèrement. « Et accessoirement, je fais les meilleurs commentaires sarcastiques du Japon. »\n\nKiki rit doucement. « Ton sens de l'humour est intact ! C'est bon signe. » Elle t'explique que tu es apprentie sorcière et que tu as eu un accident magique en tentant d'aider une créature.",
            choices: [
                { text: "« Désolée Jiji, je ne voulais pas t'offenser ! »", next: "scene5" },
                { text: "« Montrez-moi ma magie alors »", next: "scene4" },
                { text: "« Combien de temps pour récupérer ma mémoire ? »", next: "scene6" }
            ]
        },

        scene3: {
            text: "Tu observes la chambre en silence. C'est un espace chaleureux avec des cristaux suspendus qui captent la lumière, des herbes séchées au plafond, et des livres anciens empilés partout. Sur le mur, tu vois une photo de toi et Kiki chevauchant un balai volant au-dessus du château d'Osaka, riant aux éclats.\n\nUn sentiment profond de familiarité t'envahit, comme si ton cœur se souvenait même si ton esprit ne le peut pas.\n\n« Tu te souviens de quelque chose ? » demande Kiki avec un espoir teinté de tristesse dans la voix.",
            choices: [
                { text: "Toucher doucement la photo", next: "scene7" },
                { text: "« Parle-moi de ce jour-là »", next: "scene5" },
                { text: "« Je veux essayer de voler maintenant ! »", next: "death1" }
            ]
        },

        scene4: {
            text: "Dans le petit jardin derrière la maison, entouré de bambous qui murmurent dans la brise, Kiki te donne une plume blanche. « Concentre-toi sur elle. Imagine qu'elle est légère comme un nuage, qu'elle veut danser dans l'air. »\n\nTu fermes les yeux, tu respires... et tu sens quelque chose en toi, comme une rivière de lumière. La plume s'élève gracieusement, tournoyant dans les airs !\n\n« Magnifique ! » s'exclame Kiki, les larmes aux yeux. « Ta magie est toujours là, Mara ! Elle t'attend ! »",
            choices: [
                { text: "Essayer de faire léviter plusieurs objets", next: "scene8" },
                { text: "Rester prudente et maîtriser d'abord la plume", next: "scene9" },
                { text: "« Montre-moi ta magie à toi, Kiki ! »", next: "scene10" }
            ]
        },

        scene5: {
            text: "« Plus que des amies, Mara. » Les yeux de Kiki brillent d'émotion. « Tu es ma petite sœur de cœur. Il y a six mois, tu es arrivée ici, perdue et seule, chassée de ton village parce qu'ils avaient peur de ta magie. Je t'ai accueillie sans hésiter. Ensemble, nous avons tout partagé : les rires, les larmes, les sorts ratés, les gâteaux brûlés... »\n\nUne larme coule sur ta joue, née d'une émotion que tu ne comprends pas encore mais que ton cœur reconnaît.",
            choices: [
                { text: "« Merci d'avoir été là pour moi »", next: "scene11" },
                { text: "« Pratiquons la magie ensemble alors »", next: "scene4" },
                { text: "« Quelqu'un d'autre m'attendait-il dans ma vie ? »", next: "scene12" }
            ]
        },

        scene6: {
            text: "« Il existe un endroit, » commence Kiki solennellement, « la Grande Bibliothèque des Mémoires à Kyoto. Elle contient des grimoires anciens sur la restauration de la mémoire. Mais le chemin n'est pas facile. Nous devrons traverser la Forêt des Murmures, où vivent des esprits qui testent le cœur des voyageurs. »\n\nJiji frissonne : « Des tests spirituels, des illusions, des pièges magiques... Tout pour voir si tu mérites vraiment de retrouver ce que tu as perdu. »",
            choices: [
                { text: "« Allons-y immédiatement ! »", next: "scene13" },
                { text: "« Préparons-nous bien d'abord »", next: "scene14" },
                { text: "« Et si je laissais les souvenirs revenir naturellement ? »", next: "scene15" }
            ]
        },

        scene7: {
            text: "Tu poses tes doigts sur la photo. Soudain, des flashs de mémoire : le vent fouettant tes cheveux, le rire cristallin de Kiki, la sensation de liberté absolue... et quelqu'un d'autre était là ce jour-là, quelqu'un qui t'encourageait depuis le sol, quelqu'un dont la voix te réchauffait le cœur.\n\nUne migraine aiguë te saisit. Les souvenirs résistent, comme s'ils étaient protégés par un sortilège.",
            choices: [
                { text: "« Kiki... qui d'autre était là ce jour-là ? »", next: "scene12" },
                { text: "Lâcher prise, c'est trop intense", next: "scene15" },
                { text: "Creuser plus profond malgré la douleur", next: "scene16" }
            ]
        },

        scene8: {
            text: "Grisée par ton succès, tu essaies de faire léviter plusieurs cailloux à la fois. Un, deux, trois... Soudain, ta magie devient incontrôlable ! Des dizaines d'objets s'envolent dans tous les sens. Un pot de fleurs fonce droit vers Jiji !\n\nL'adrénaline pulse dans tes veines. Tu réagis instinctivement : « STOP ! » Un mot de pouvoir jaillit de toi. Tout se fige dans les airs, comme suspendu dans le temps.",
            choices: [
                { text: "Déposer tout doucement au sol", next: "scene17" },
                { text: "Paniquer et tout laisser tomber", next: "death2" },
                { text: "Essayer de diriger cette magie sauvage", next: "scene18" }
            ]
        },

        scene9: {
            text: "Tu choisis la sagesse. Pendant des heures, tu pratiques avec la plume, apprenant à sentir les nuances de ta magie. Kiki t'observe avec fierté, t'encourageant à chaque progrès.\n\nLes jours deviennent des semaines. Ta maîtrise grandit. Tu apprends à faire danser plusieurs plumes ensemble, à créer des motifs complexes dans l'air.\n\nUn matin, Kiki entre dans ta chambre avec un sourire mystérieux : « Mara, je pense que quelque chose... ou quelqu'un... t'attend aujourd'hui. »",
            choices: [
                { text: "« De quoi parles-tu ? »", next: "scene19" },
                { text: "Sentir l'énergie magique dans l'air", next: "scene19" },
                { text: "« Est-ce que c'est mon familier ? »", next: "scene19" }
            ]
        },

        scene10: {
            text: "Kiki sourit et lève les mains. Des milliers de lucioles magiques apparaissent, formant des constellations qui racontent des histoires. Tu vois des scènes de votre amitié : vous préparant des potions, volant sous la lune, riant jusqu'aux larmes.\n\n« C'est le Sort des Souvenirs Lumineux, » murmure-t-elle. « Chaque luciole est un moment que je chéris. C'est comme ça que je garde mes souvenirs précieux en sécurité. »\n\nC'est la chose la plus belle que tu aies jamais vue.",
            choices: [
                { text: "« Est-ce que j'avais des sorts spéciaux comme celui-là ? »", next: "scene20" },
                { text: "« Peux-tu m'apprendre ce sort ? »", next: "scene21" },
                { text: "Essayer de reproduire le sort immédiatement", next: "scene22" }
            ]
        },

        scene11: {
            text: "Kiki t'étreint tendrement. « Tu sais ce que tu m'as apporté, Mara ? La joie. Le courage de croire en la magie même quand tout semblait perdu. Et surtout, tu m'as appris que la famille, ce n'est pas seulement le sang. C'est le cœur. »\n\nJiji saute entre vous deux : « Bon, c'est très touchant tout ça, mais qui veut du poisson grillé pour le petit-déjeuner ? »",
            choices: [
                { text: "Accepter avec joie", next: "scene23" },
                { text: "« D'abord, continuons à explorer ma magie »", next: "scene4" },
                { text: "« Promets-moi qu'on restera toujours ensemble »", next: "scene24" }
            ]
        },

        scene12: {
            text: "Le visage de Kiki devient doux, presque mélancolique. « Il y avait quelqu'un... quelqu'un de très spécial qui croyait en toi plus que quiconque. Qui t'encourageait dans chaque sort, qui te faisait rire quand tu étais frustrée. Tu étais... si heureuse quand cette personne était là. »\n\nElle hésite, puis ajoute doucement : « Cette personne t'attend toujours, Mara. Elle n'a jamais cessé d'attendre. »\n\nTon cœur bat plus fort, comme s'il reconnaissait quelque chose que ton esprit a oublié.",
            choices: [
                { text: "« Où est cette personne maintenant ? »", next: "scene25" },
                { text: "« Pourquoi tu as l'air si triste en en parlant ? »", next: "scene25" },
                { text: "« Alors aidons-moi à retrouver ma mémoire ! »", next: "scene13" }
            ]
        },

        scene13: {
            text: "Vous partez pour Kyoto. Le voyage en train vous fait traverser des paysages magnifiques, mais c'est la Forêt des Murmures qui vous attend. Quand vous y entrez, l'atmosphère change instantanément. La lumière devient éthérée, et tu entends des voix anciennes chuchoter dans les arbres.\n\nDevant vous apparaissent trois chemins. Jiji observe : « Chaque chemin représente un test différent. Choisis avec ton cœur, pas avec ta tête. »",
            choices: [
                { text: "Le chemin illuminé par des lucioles dorées", next: "scene26" },
                { text: "Le chemin sombre bordé de pierres anciennes", next: "scene27" },
                { text: "Le chemin fleuri aux parfums enivrants", next: "scene28" }
            ]
        },

        scene14: {
            text: "Sage décision. Kiki et toi passez une semaine à vous préparer. Elle t'enseigne un sort de bouclier protecteur, vous préparez des potions de clarté mentale, et vous rassemblez des provisions magiques.\n\nLa veille du départ, Kiki te donne un cristal bleu : « C'est un Cristal de Vérité. Si jamais tu es perdue dans une illusion, il te montrera la réalité. »\n\n« Demain, nous partons pour Kyoto. »",
            choices: [
                { text: "Aller dormir et laisser venir les rêves", next: "scene29" },
                { text: "Méditer toute la nuit", next: "scene30" },
                { text: "Passer la nuit à parler de vos peurs avec Kiki", next: "scene31" }
            ]
        },

        scene15: {
            text: "« C'est une approche sage, » dit Kiki en souriant. « Parfois, forcer les choses peut faire plus de mal que de bien. Laissons le temps faire son œuvre. »\n\nLes jours passent paisiblement. Tu continues à pratiquer ta magie, à aider Kiki dans la maison, à écouter les histoires de Jiji. Petit à petit, tu te sens grandir, même sans tes souvenirs.\n\nPuis, un matin particulier, Kiki te dit : « J'ai quelque chose à te montrer. »",
            choices: [
                { text: "« De quoi s'agit-il ? »", next: "scene19" },
                { text: "Suivre Kiki sans poser de questions", next: "scene19" }
            ]
        },

        scene16: {
            text: "Tu refuses de lâcher prise. Tu forces ton esprit à se souvenir, poussant contre la barrière magique. Des flashs plus intenses : un rire chaleureux, une main tendue, des mots d'encouragement... « Tu peux le faire, Mara ! Je crois en toi ! »\n\nLa douleur devient insoutenable. Tu t'évanouis.\n\nTu te réveilles trois jours plus tard. Kiki est à ton chevet, épuisée. « Tu as dormi pendant trois jours... mais quelque chose a changé. Tu te souviens de quelque chose ? »",
            choices: [
                { text: "« J'ai vu... quelqu'un d'important pour moi... »", next: "scene25" },
                { text: "« Qu'est-ce qui m'est arrivé exactement ? »", next: "scene32" }
            ]
        },

        scene17: {
            text: "Avec une concentration intense, tu guides chaque objet jusqu'au sol, un par un. C'est épuisant. Quand le dernier caillou touche la terre, tu t'effondres, à bout de forces.\n\nKiki te rattrape avant que tu ne tombes : « Mara ! C'était incroyable ! Tu as découvert quelque chose d'essentiel : ta magie est guidée par ton désir de protéger ceux que tu aimes ! »\n\nJiji ronronne : « Impressionnant pour une sorcière amnésique ! »",
            choices: [
                { text: "« J'ai eu si peur de vous blesser... »", next: "scene11" },
                { text: "« Je commence à comprendre ma magie maintenant »", next: "scene33" },
                { text: "« Continuons l'entraînement quand je serai reposée »", next: "scene9" }
            ]
        },

        scene18: {
            text: "Au lieu de lutter contre la magie sauvage, tu l'accueilles. Tu danses avec elle, tu l'écoutes. Elle tourbillonne autour de toi comme un typhon d'énergie pure... puis, petit à petit, elle se calme, reconnaissant en toi une alliée, pas une maîtresse.\n\nKiki te regarde avec émerveillement : « Mara... tu viens de faire quelque chose que peu de sorcières peuvent faire. Tu as communiqué avec la magie brute elle-même ! »",
            choices: [
                { text: "« C'était comme danser avec le vent »", next: "scene33" },
                { text: "« La magie a sa propre volonté... »", next: "scene33" },
                { text: "« Apprends-moi d'autres techniques ! »", next: "scene9" }
            ]
        },

        scene19: {
            text: "Kiki te mène au grenier poussiéreux. Au milieu de vieux grimoires et de reliques magiques, elle sort un parchemin scellé par de la cire dorée marquée d'un symbole que tu ne reconnais pas... mais qui fait vibrer ton cœur.\n\n« Ce message... il est pour toi. De quelqu'un qui t'aime profondément. J'avais promis de te le donner quand tu serais prête. »\n\nTon cœur s'emballe. Ta main tremble en tendant la main vers le parchemin.",
            choices: [
                { text: "Briser le sceau avec détermination", next: "scene51" },

            content.innerHTML = `
                <div class="death-screen">
                    <h2 class="death-title">💔</h2>
                    <p class="scene-text">${scene.text}</p>
                    <button class="restart-btn" onclick="displayScene('start')">Recommencer</button>
                </div>
            `;
        } else {
            const sceneNumber = visitedScenes.size;
            let choicesHTML = '<div class="choices">';
            scene.choices.forEach((choice) => {
                choicesHTML += `<button class="choice-btn" onclick="displayScene('${choice.next}')">${choice.text}</button>`;
            });
            choicesHTML += '</div>';
            
            content.innerHTML = `
                <div class="scene-number">Scène ${sceneNumber}</div>
                <p class="scene-text">${scene.text}</p>
                ${choicesHTML}
            `;
        }
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    displayScene('start');
</script>

</body>
</html>
