<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Ombres Oubliées 🌑</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;400;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --void-black: #0a0a0f;
            --blood-red: #8b0000;
            --ash-gray: #2a2a3e;
            --bone-white: #e8e8e8;
            --ghost-blue: #4a6fa5;
            --shadow: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: linear-gradient(135deg, var(--void-black) 0%, var(--ash-gray) 100%);
            color: var(--bone-white);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .fog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 10, 15, 0.5) 100%);
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-card {
            background: rgba(42, 42, 62, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 10px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px var(--shadow), 
                        inset 0 0 0 1px rgba(74, 111, 165, 0.2);
            border: 1px solid rgba(139, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2em;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            color: var(--bone-white);
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }

        .subtitle {
            text-align: center;
            color: var(--ghost-blue);
            font-size: 1.1em;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .scene-text {
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: justify;
            color: var(--bone-white);
            opacity: 0;
            animation: textAppear 0.6s ease-out 0.2s forwards;
        }

        @keyframes textAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .choice-btn {
            background: linear-gradient(135deg, rgba(74, 111, 165, 0.2), rgba(139, 0, 0, 0.2));
            border: 2px solid var(--blood-red);
            color: var(--bone-white);
            padding: 18px 25px;
            border-radius: 8px;
            font-family: 'Crimson Pro', serif;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: choiceAppear 0.5s ease-out forwards;
        }

        .choice-btn:nth-child(1) { animation-delay: 0.3s; }
        .choice-btn:nth-child(2) { animation-delay: 0.4s; }

        @keyframes choiceAppear {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .choice-btn:hover {
            background: linear-gradient(135deg, rgba(74, 111, 165, 0.4), rgba(139, 0, 0, 0.4));
            border-color: var(--ghost-blue);
            transform: translateX(10px);
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.4);
        }

        .choice-btn:active {
            transform: translateX(10px) scale(0.98);
        }

        .start-btn {
            background: linear-gradient(135deg, var(--blood-red), var(--ash-gray));
            border: 2px solid var(--ghost-blue);
            color: var(--bone-white);
            padding: 20px 50px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.3em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(139, 0, 0, 0.5);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(139, 0, 0, 0.7);
        }

        .scene-number {
            text-align: center;
            color: var(--ghost-blue);
            font-size: 0.9em;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .death-screen {
            text-align: center;
        }

        .death-title {
            font-size: 2em;
            color: var(--blood-red);
            margin-bottom: 20px;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--ghost-blue), var(--blood-red));
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(74, 111, 165, 0.5);
        }

        .final-scroll {
            background: rgba(139, 0, 0, 0.1);
            border: 3px solid var(--blood-red);
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            text-align: center;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .game-card {
                padding: 30px 20px;
            }

            .title {
                font-size: 1.8em;
            }

            .scene-text {
                font-size: 1.05em;
            }

            .choice-btn {
                padding: 15px 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="fog"></div>

    <div class="container">
        <div class="game-card">
            <div id="game-content"></div>
        </div>
    </div>

    <script>
        const scenes = {
            start: {
                text: "Le silence te réveille. Un silence absolu, comme si le monde retenait son souffle.\n\nTu ouvres les yeux dans une chambre plongée dans la pénombre. Ton esprit est vide. Pas seulement confus - vide. Comme un grimoire dont toutes les pages auraient été arrachées et brûlées.\n\nQui es-tu ? Où es-tu ? Et pourquoi ce vide béant dans ta poitrine, comme si quelque chose d'infiniment précieux avait été arraché de ton cœur ?\n\nUne silhouette se dessine dans l'embrasure. Cheveux roux, regard hanté par l'épuisement. « Mara... Tu es enfin réveillée. »",
                choices: [
                    { text: "« Qui êtes-vous ? Qui suis-je ? »", next: "scene1" },
                    { text: "Observer en silence, chercher des indices", next: "scene2" }
                ]
            },

            scene1: {
                text: "« Je m'appelle Kiki. » Elle s'approche lentement, prudemment. « Et toi... tu es Mara. Une sorcière. Du moins, tu l'étais. »\n\nSes mots tombent comme des pierres.\n\n« Il y a trois semaines, tu as tenté un rituel interdit. Pour briser une malédiction. Pour sauver quelqu'un que tu aimais plus que ta propre vie. » Sa voix se brise légèrement. « Le rituel a échoué. Il a dévoré ta mémoire et fracturé ta magie. »\n\nUn chat noir aux yeux dorés saute sur le rebord de la fenêtre, t'observant avec une intensité troublante.",
                choices: [
                    { text: "« Qui ai-je essayé de sauver ? »", next: "scene3" },
                    { text: "« Ma magie... elle est vraiment perdue ? »", next: "scene4" }
                ]
            },

            scene2: {
                text: "Tu regardes autour de toi. La chambre porte les stigmates d'une catastrophe : cristaux fissurés, grimoires brûlés, murs marqués de traces de sortilèges.\n\nSur une étagère, tu aperçois une photo déchirée. Toi et la rousse, souriantes, et une troisième personne dont le visage a été littéralement effacé, comme si la réalité elle-même refusait de s'en souvenir.\n\nDans le coin, un balai ancien appuyé contre le mur. Ses runes gravées pulsent faiblement, comme un cœur mourant.\n\n« Tu cherches des réponses ? » dit la rousse. « Je m'appelle Kiki. Et toi, tu es Mara. »",
                choices: [
                    { text: "« Que s'est-il passé ici ? »", next: "scene1" },
                    { text: "« Cette photo... qui est cette troisième personne ? »", next: "scene3" }
                ]
            },

            scene3: {
                text: "Le visage de Kiki s'assombrit. « Quelqu'un de très important. Pour toi. Pour moi. Pour nous tous. » Elle serre les poings.\n\n« Cette personne a été frappée par une malédiction ancestrale. Une malédiction d'effacement. Quiconque est touché sera progressivement oublié par le monde entier. Les photos disparaissent. Les souvenirs s'estompent. Même la magie ne peut plus les percevoir. »\n\nElle sort un parchemin scellé de cire noire. « Avant que tu tentes le rituel, cette personne t'a écrit un message. Pour le cas où... tu perdrais tout. »",
                choices: [
                    { text: "« Je veux lire ce message maintenant »", next: "scene5" },
                    { text: "« D'abord, aide-moi à récupérer ma magie »", next: "scene4" }
                ]
            },

            scene4: {
                text: "« Ta magie n'est pas morte, » dit Kiki en s'approchant de la fenêtre. « Elle est... fragmentée. Dispersée. Comme ton esprit. »\n\nElle ouvre un vieux grimoire couvert de cendres. « Mais je peux t'aider à la reconstruire. Morceau par morceau. Sort par sort. » Son regard devient dur. « Cependant, ce sera dangereux. Ta magie est instable. Un mot de travers, une concentration qui flanche... et tu pourrais nous tuer toutes les deux. »\n\nLe chat noir miaule : « Ou pire. La magie ratée ne tue pas toujours. Parfois, elle transforme. Corrompt. Maudit. »",
                choices: [
                    { text: "« Je suis prête à prendre ce risque »", next: "magic1" },
                    { text: "« Explique-moi d'abord les dangers précis »", next: "scene6" }
                ]
            },

            scene5: {
                text: "Kiki secoue la tête fermement. « Non. Si je te donne ce message maintenant, dans ton état... » Elle hésite. « Les émotions sont de la magie brute, Mara. Ce message contient des sentiments intenses. Si tu le lis sans pouvoir canaliser cette énergie, ton cœur pourrait littéralement exploser. »\n\nLe chat noir confirme d'un hochement de tête : « J'ai vu ça arriver. Ce n'est pas beau. »\n\n« Tu dois d'abord récupérer ta magie. Apprendre à contrôler ton énergie. Puis, et seulement puis, tu pourras lire ce message en sécurité. »",
                choices: [
                    { text: "« Alors entraînons-nous. Maintenant »", next: "magic1" },
                    { text: "« Combien de temps ça prendra ? »", next: "scene6" }
                ]
            },

            scene6: {
                text: "« La magie instable peut faire trois choses, » explique Kiki en montrant des illustrations dans le grimoire. « Un : elle peut exploser, tuant tout dans un rayon de plusieurs mètres. Deux : elle peut se retourner contre le lanceur, le consumant de l'intérieur. Trois : elle peut se manifester de manière imprévisible. »\n\nElle te montre l'image d'une sorcière transformée en statue de sel. « Cette apprentie a mal prononcé un sort de lévitation. »\n\nLe chat ajoute : « Mais avec de la discipline et de la prudence, tu peux réapprendre. C'est juste... risqué. »",
                choices: [
                    { text: "« Je comprends. Commençons l'entraînement »", next: "magic1" },
                    { text: "« Y a-t-il un moyen plus sûr ? »", next: "scene7" }
                ]
            },

            scene7: {
                text: "Kiki soupire. « Le moyen le plus sûr serait d'attendre. Des années. Des décennies peut-être. Laisser ta magie revenir naturellement. »\n\nElle regarde par la fenêtre, vers la ville illuminée d'Osaka. « Mais pendant ce temps, cette personne que tu aimes... elle continue d'être effacée. Jour après jour. Jusqu'à ce qu'elle disparaisse complètement. »\n\n« Il reste peut-être six mois, » murmure-t-elle. « Après ça... même toi tu ne pourras plus te souvenir de l'avoir aimée. »",
                choices: [
                    { text: "« Alors je n'ai pas le choix. Entraînons-nous »", next: "magic1" },
                    { text: "« Six mois... c'est si peu... »", next: "magic1" }
                ]
            },

            magic1: {
                text: "Kiki t'emmène dans une pièce de pratique aux murs gravés de runes de protection. « Nous commençons par le plus simple. Les fondamentaux. »\n\nElle pose une plume noire sur une table. « Le sort de lévitation basique : LEVITAS. » Elle prononce le mot, et la plume s'élève gracieusement.\n\n« À toi. Concentre-toi sur la plume. Visualise-la s'élevant. Puis prononce le mot. Clairement. Fermement. »\n\nTu respires profondément.",
                choices: [
                    { text: "Prononcer « LEVITAS » calmement", next: "magic2" },
                    { text: "Prononcer « LEVITAS » avec force", next: "magic2" }
                ]
            },

            magic2: {
                text: "« LEVITAS. »\n\nLa plume tremble. Elle s'élève de quelques centimètres... puis vacille et retombe.\n\nKiki sourit faiblement. « C'est un début. Ta connexion magique existe encore. » Elle pose une deuxième plume. « Recommence. Encore. Et encore. Jusqu'à ce que ça devienne instinct. »\n\nLes heures passent. Tu répètes le sort. Dix fois. Vingt fois. Cinquante fois. La fatigue te gagne, mais la plume commence à obéir plus facilement.",
                choices: [
                    { text: "Continuer jusqu'à la maîtrise totale", next: "magic3" },
                    { text: "« Je suis épuisée. Une pause ? »", next: "magic4" }
                ]
            },

            magic3: {
                text: "Tu refuses d'abandonner. Cent fois. Deux cents fois. La plume danse maintenant au-dessus de ta paume, stable et contrôlée.\n\nKiki observe, impressionnée. « Ta détermination... c'est exactement ce qui faisait de toi une grande sorcière. »\n\nLe chat ronronne : « Maintenant, le vrai test. » Il pose un livre sur la table. « Fais léviter quelque chose de plus lourd. »",
                choices: [
                    { text: "« LEVITAS » sur le livre", next: "magic5" },
                    { text: "« D'abord, montrez-moi comment faire »", next: "magic6" }
                ]
            },

            magic4: {
                text: "« Sage décision, » dit Kiki. « La magie épuisée est une magie dangereuse. » Elle te tend une tisane fumante. « Bois. Ça restaurera ton énergie. »\n\nLe liquide est amer mais revigorant. La fatigue s'estompe progressivement.\n\n« La magie n'est pas seulement du pouvoir, » explique-t-elle. « C'est aussi de l'endurance. De la patience. De la sagesse de savoir quand s'arrêter. »",
                choices: [
                    { text: "Se reposer puis reprendre l'entraînement", next: "magic3" },
                    { text: "« Parle-moi de mes anciennes capacités »", next: "scene8" }
                ]
            },

            magic5: {
                text: "« LEVITAS ! » Tu te concentres sur le livre.\n\nIl s'élève... mais il est lourd. Très lourd. Ta concentration vacille. Le livre oscille dangereusement au-dessus de Kiki.\n\n« Mara ! » crie-t-elle. « Contrôle ou lâche prise ! »\n\nTu sens ta magie devenir instable. Le livre commence à trembler violemment.",
                choices: [
                    { text: "Prononcer « FINIS » pour tout arrêter", next: "magic7" },
                    { text: "Forcer pour maintenir le contrôle", next: "death1" }
                ]
            },

            magic6: {
                text: "Kiki hoche la tête. « Bien. Observe. » Elle tend la main. « LEVITAS. »\n\nLe livre s'élève lentement, de manière fluide. « Tu vois ? Ce n'est pas de la force. C'est de la persuasion. Tu demandes à l'objet de s'élever, tu ne le forces pas. »\n\nElle le fait tourner dans l'air, puis le repose délicatement. « À toi maintenant. Avec douceur. »",
                choices: [
                    { text: "« LEVITAS » avec douceur", next: "magic8" },
                    { text: "« LEVITAS » en imitant sa technique", next: "magic8" }
                ]
            },

            magic7: {
                text: "« FINIS ! » hurles-tu.\n\nLe sort se rompt instantanément. Le livre tombe lourdement sur la table. Toi, tu t'effondres à genoux, épuisée.\n\nKiki te soutient. « Bon réflexe. Tu as appris FINIS instinctivement - le contre-sort universel. » Elle te relève doucement. « C'est un sort crucial qui peut te sauver la vie. »\n\nLe chat saute sur tes genoux : « Et tu viens de l'apprendre de la manière la plus difficile. »",
                choices: [
                    { text: "« Je veux réessayer le livre »", next: "magic8" },
                    { text: "« Enseignez-moi d'autres sorts d'abord »", next: "magic9" }
                ]
            },

            magic8: {
                text: "Cette fois, tu y vas avec patience. « LEVITAS. » Le livre s'élève, centimètre par centimètre. Stable. Contrôlé.\n\nKiki applaudit : « Parfait ! Tu as compris. » Elle sourit pour la première fois depuis ton réveil. « Tu es en train de redevenir toi-même, Mara. »\n\nLe livre flotte paisiblement au-dessus de la table. Tu le maintiens pendant une minute entière avant de le reposer.",
                choices: [
                    { text: "« Quel est le prochain sort ? »", next: "magic9" },
                    { text: "« Pratiquons plus avec LEVITAS »", next: "magic10" }
                ]
            },

            magic9: {
                text: "Kiki ouvre le grimoire à une nouvelle page. « Le sort de feu : IGNIS MINOR. » Une petite flamme apparaît dans sa paume. « C'est plus dangereux. Le feu ne pardonne pas les erreurs. »\n\nElle place une bougie devant toi. « Prononce le sort en visualisant une petite flamme. Pas un brasier. Pas une inferno. Juste une flamme de bougie. »\n\nLe chat recule prudemment vers la porte.",
                choices: [
                    { text: "« IGNIS MINOR » avec prudence", next: "magic11" },
                    { text: "« Je ne me sens pas prête pour le feu »", next: "magic12" }
                ]
            },

            magic10: {
                text: "Tu passes l'heure suivante à perfectionner LEVITAS. Tu fais léviter plusieurs objets simultanément. Tu les fais danser dans l'air avec grâce.\n\nKiki observe en silence, un sourire mélancolique aux lèvres. « Tu volais de la même manière. Avec cette grâce naturelle. »\n\nLe chat miaule : « Elle est prête pour le feu maintenant. »",
                choices: [
                    { text: "« Apprenez-moi IGNIS MINOR »", next: "magic9" },
                    { text: "« Parlons plutôt du balai »", next: "scene9" }
                ]
            },

            magic11: {
                text: "« IGNIS MINOR, » dis-tu doucement.\n\nUne étincelle jaillit de ton doigt... puis une flamme. Petite. Contrôlée. Parfaite.\n\nKiki rayonne de fierté : « Excellent ! Tu as un contrôle naturel ! » Elle éteint la bougie d'un souffle. « Maintenant, sans support. Crée une flamme dans ta paume. »\n\nC'est plus difficile. Aucun point d'ancrage. Juste toi et la magie.",
                choices: [
                    { text: "Visualiser et prononcer « IGNIS MINOR »", next: "magic13" },
                    { text: "« Montre-moi d'abord »", next: "magic14" }
                ]
            },

            magic12: {
                text: "« C'est sage d'avoir peur du feu, » dit Kiki. « Beaucoup de sorcières meurent brûlées par leur propre magie. »\n\nElle referme le grimoire. « Nous pouvons passer à autre chose. » Elle tend la main et une brise se lève. « VENTUS - le sort de vent. Plus doux que le feu, mais tout aussi difficile à maîtriser. »",
                choices: [
                    { text: "« Apprenez-moi VENTUS »", next: "magic15" },
                    { text: "« Finalement, je veux essayer le feu »", next: "magic9" }
                ]
            },

            magic13: {
                text: "« IGNIS MINOR. »\n\nUne flamme danse dans ta paume. Tu la sens. Sa chaleur. Son énergie. Elle ne te brûle pas - elle te reconnaît.\n\nPuis elle grandit. Trop vite. La chaleur devient intense.\n\nKiki hurle : « FINIS ! Vite ! »",
                choices: [
                    { text: "« FINIS ! » immédiatement", next: "magic16" },
                    { text: "Essayer de la contrôler au lieu de l'arrêter", next: "death2" }
                ]
            },

            magic14: {
                text: "Kiki tend sa paume. « IGNIS MINOR. » Une flamme parfaite apparaît, dansant joyeusement. « Tu vois ? Elle fait partie de moi. Je ne la crains pas. Elle ne me craint pas. C'est une relation. »\n\nElle ferme la main. La flamme disparaît. « À toi. N'aie pas peur. La peur rend la magie instable. »",
                choices: [
                    { text: "Respirer, se calmer, puis prononcer le sort", next: "magic17" },
                    { text: "« Je préfère commencer avec VENTUS »", next: "magic15" }
                ]
            },

            magic15: {
                text: "« VENTUS, » dit Kiki. Une brise douce tourbillonne dans la pièce, faisant danser les pages du grimoire.\n\n« Le vent est capricieux, » explique-t-elle. « Il veut jouer. Tu dois jouer avec lui, pas le dominer. » Elle te fait face. « Prononce le sort. Mais imagine un vent doux. Une caresse. Pas une tempête. »",
                choices: [
                    { text: "« VENTUS » en pensant à une brise légère", next: "magic18" },
                    { text: "« VENTUS » en imaginant le vent violent", next: "death3" }
                ]
            },

            magic16: {
                text: "« FINIS ! »\n\nLa flamme s'éteint instantanément. Tu regardes ta paume rougie mais intacte. Le sort t'a écoutée juste à temps.\n\nKiki soupire de soulagement. « Tu apprends vite à utiliser FINIS. C'est bon signe. » Elle examine ta main. « Pas de brûlure. Ta magie t'a protégée. »\n\nLe chat ronronne : « Elle a un talent naturel pour le feu. Dangereux, mais impressionnant. »",
                choices: [
                    { text: "« Je veux maîtriser IGNIS MINOR »", next: "magic19" },
                    { text: "« Passons à un autre sort »", next: "magic15" }
                ]
            },

            magic17: {
                text: "Tu fermes les yeux. Tu respires. « IGNIS MINOR. »\n\nLa flamme apparaît. Petite. Stable. Belle. Tu la regardes danser dans ta paume, émerveillée.\n\nKiki applaudit : « Magnifique ! Tu vois ? La confiance et le calme sont tes alliés. »\n\nTu maintiens la flamme pendant plusieurs secondes, puis la dissipes d'un geste.",
                choices: [
                    { text: "« Je me sens prête pour VENTUS »", next: "magic15" },
                    { text: "« Pratiquons plus avec le feu »", next: "magic19" }
                ]
            },

            magic18: {
                text: "« VENTUS. »\n\nUne brise légère se lève, caressant tes cheveux. Les pages du grimoire frémissent doucement. C'est apaisant. Naturel.\n\nKiki sourit : « Parfait. Le vent t'aime. » Elle ferme les yeux, savourant la brise. « Tu as toujours eu une affinité avec l'air. C'est pour ça que tu étais si douée en vol. »\n\nLe balai dans le coin de la pièce vibre légèrement, comme répondant au vent.",
                choices: [
                    { text: "« Parle-moi du vol »", next: "scene9" },
                    { text: "« Continuons avec la magie élémentaire »", next: "magic19" }
                ]
            },

            magic19: {
                text: "Les jours suivants, tu t'entraînes sans relâche. LEVITAS devient aussi naturel que respirer. IGNIS MINOR et VENTUS répondent à ta volonté.\n\nKiki te fait pratiquer des combinaisons : léviter un objet tout en créant une flamme. Invoquer le vent pour disperser le feu.\n\n« Tu progresses incroyablement vite, » dit-elle un soir. « Comme si ta magie n'attendait que d'être réveillée. »\n\nLe chat saute sur la table : « Il est temps de parler de sorts plus avancés. Et du vol. »",
                choices: [
                    { text: "« Quels sorts avancés ? »", next: "magic20" },
                    { text: "« Parlons du balai »", next: "scene9" }
                ]
            },

            magic20: {
                text: "Kiki ouvre le grimoire à une page marquée de sang séché. « SANCTUM PROTECTUS - le bouclier protecteur. » Elle dessine un cercle de craie autour de toi. « C'est un sort crucial pour survivre. »\n\nElle se place en face de toi. « Prononce les mots, et un bouclier magique t'entourera. Mais attention : s'il se brise sous un impact, le contrecoup peut te tuer. Il faut savoir quand le dissiper. »",
                choices: [
                    { text: "« SANCTUM PROTECTUS ! »", next: "magic21" },
                    { text: "« C'est trop dangereux. Autre chose ? »", next: "scene9" }
                ]
            },

            magic21: {
                text: "« SANCTUM PROTECTUS ! »\n\nUne sphère de lumière bleutée t'entoure. Tu sens sa solidité. Son pouvoir. C'est grisant.\n\nKiki lance un sort mineur contre le bouclier. Il tient bon. Elle augmente la puissance. Des fissures apparaissent.\n\n« Maintenant, arrête-le avant qu'il se brise ! » crie-t-elle en lançant un sort encore plus puissant.",
                choices: [
                    { text: "« FINIS ! » sans hésiter", next: "magic22" },
                    { text: "Renforcer le bouclier au lieu de l'arrêter", next: "death4" }
                ]
            },

            magic22: {
                text: "« FINIS ! »\n\nLe bouclier disparaît une fraction de seconde avant l'impact du sort de Kiki. Tu es projetée en arrière par le souffle, mais indemne.\n\nKiki t'aide à te relever : « Excellent réflexe. Tu aurais pu mourir si tu avais essayé de tenir. » Elle te serre dans ses bras. « Tu deviens forte, Mara. Presque aussi forte qu'avant. »\n\nLe balai dans le coin vibre plus intensément. Comme s'il t'appelait.",
                choices: [
                    { text: "« Il est temps d'apprendre à voler »", next: "scene9" },
                    { text: "« D'abord, d'autres sorts de combat »", next: "magic23" }
                ]
            },

            magic23: {
                text: "Kiki t'enseigne IMPETUS - un sort de force brute qui repousse les ennemis. Puis GLACIES MINOR - pour geler de petits objets. Chaque sort enrichit ton arsenal.\n\nUne semaine s'est écoulée depuis ton réveil. Ta magie est revenue, pas complète, mais fonctionnelle. Mortellement fonctionnelle.\n\n« Tu es prête maintenant, » dit Kiki en te tendant le balai. « Prête pour voler. »",
                choices: [
                    { text: "Prendre le balai avec révérence", next: "scene9" },
                    { text: "« Encore un peu d'entraînement magique »", next: "magic19" }
                ]
            },

            scene8: {
                text: "Kiki s'assoit, un sourire mélancolique aux lèvres. « Tu étais exceptionnelle. Pas la plus puissante, mais la plus... gracieuse. Ta magie ressemblait à de la danse. »\n\nElle montre une photo miraculeusement préservée : toi, volant sur ton balai, entourée de flammes et de vent, souriant avec une joie pure.\n\n« Et la personne que tu aimais... elle te regardait toujours voler avec une telle admiration. Un tel amour. »",
                choices: [
                    { text: "Sentir ton cœur se serrer", next: "magic3" },
                    { text: "« Je veux retrouver cette force »", next: "magic3" }
                ]
            },

            scene9: {
                text: "Tu prends le balai. Il vibre sous tes doigts, reconnaissant quelque chose en toi. Les runes s'illuminent faiblement.\n\nKiki sourit : « Il se souvient de toi. Même si toi, tu ne t'en souviens pas. » Elle prend son propre balai. « Le vol demande trois choses : un sort d'activation, de la concentration, et de la confiance. »\n\nElle te mène sur le toit. La ville s'étend en contrebas, lumières scintillantes sous le ciel nocturne.\n\n« Le sort est : VOLATUS ASCENDO. »",
                choices: [
                    { text: "« Montre-moi d'abord »", next: "flight1" },
                    { text: "« Je veux essayer immédiatement »", next: "flight2" }
                ]
            },

            flight1: {
                text: "Kiki enfourche son balai avec grâce. « VOLATUS ASCENDO. »\n\nElle s'élève dans les airs. Lentement d'abord, puis avec plus d'assurance. Elle vole en cercles autour du toit, monte, descend, pivote.\n\n« Tu vois ? C'est comme danser. Le balai devient une extension de toi. » Elle atterrit délicatement. « Les contre-sorts sont cruciaux : VOLATUS LENTUS pour ralentir, VOLATUS CESSUS pour arrêter, et PLUMA CORPORIS si tu tombes. »",
                choices: [
                    { text: "Mémoriser les sorts puis essayer", next: "flight3" },
                    { text: "« Réexplique-moi PLUMA CORPORIS »", next: "flight4" }
                ]
            },

            flight2: {
                text: "Tu enfourches le balai avec détermination. « VOLATUS ASCENDO ! »\n\nLe balai bondit violemment ! Tu t'envoles de manière incontrôlée, montant trop vite, trop haut !\n\nKiki hurle : « Le contre-sort ! VOLATUS LENTUS ! »\n\nLe sol s'éloigne à une vitesse terrifiante. Ta panique monte.",
                choices: [
                    { text: "Crier « VOLATUS LENTUS ! »", next: "flight5" },
                    { text: "Essayer de sauter du balai", next: "death5" }
                ]
            },

            flight3: {
                text: "Tu répètes les formules : « VOLATUS ASCENDO. VOLATUS LENTUS. VOLATUS CESSUS. PLUMA CORPORIS. »\n\nPuis tu enfourches le balai. Tu respires. « VOLATUS ASCENDO. »\n\nLe balai s'élève. Doucement. Contrôlé. Un mètre. Deux mètres. L'air frais de la nuit caresse ton visage.\n\nLa sensation est indescriptible. Liberté. Joie. Comme si une partie oubliée de toi se réveillait.",
                choices: [
                    { text: "Rester stable et savourer", next: "flight6" },
                    { text: "Essayer de monter plus haut", next: "flight7" }
                ]
            },

            flight4: {
                text: "« PLUMA CORPORIS fait de ton corps une plume, » explique Kiki. « Si tu tombes et que tu le prononces à temps, tu floteras jusqu'au sol sans te blesser. C'est le sort qui sauve le plus de vies de sorcières volantes. »\n\nElle te fait répéter dix fois. Vingt fois. Jusqu'à ce que ce soit instinctif.\n\n« Bien. Maintenant, tu es prête. »",
                choices: [
                    { text: "Monter sur le balai avec confiance", next: "flight3" },
                    { text: "« Encore quelques répétitions »", next: "flight3" }
                ]
            },

            flight5: {
                text: "« VOLATUS LENTUS ! » cries-tu, ta voix tremblante de terreur.\n\nLe balai ralentit. Pas assez vite, mais suffisamment. Tu perds l'équilibre et glisses.\n\nTu tombes.\n\n« PLUMA CORPORIS ! » hurle Kiki depuis le toit.\n\nTon corps devient léger. Tu descends doucement, comme une plume, atterrissant dans les bras de Kiki qui a couru en bas.",
                choices: [
                    { text: "« Je suis désolée... »", next: "flight8" },
                    { text: "« Je veux réessayer »", next: "flight8" }
                ]
            },

            flight6: {
                text: "Tu restes à trois mètres du sol, savourant cette sensation nouvelle mais familière. Le vent joue dans tes cheveux. Le balai vibre doucement sous toi.\n\nKiki vole à tes côtés, souriant. « Tu es naturelle. Comme si tu n'avais jamais arrêté. »\n\nAu loin, les lumières d'Osaka scintillent. Quelque part dans cette ville, quelqu'un t'attend. Quelqu'un qui est en train d'être oublié.",
                choices: [
                    { text: "« Apprenez-moi à aller plus vite »", next: "flight9" },
                    { text: "« Atterrissons. Je suis prête pour Kyoto »", next: "scene10" }
                ]
            },

            flight7: {
                text: "Tu penches le balai vers le haut. Tu montes. Cinq mètres. Dix mètres. Vingt mètres.\n\nLe vent devient plus fort. Une bourrasque te frappe de côté. Le balai vacille dangereusement !\n\nKiki crie : « Stabilise-toi ! Ou descends ! »",
                choices: [
                    { text: "« VOLATUS LENTUS » pour descendre", next: "flight10" },
                    { text: "Chevaucher le vent comme avec VENTUS", next: "flight11" }
                ]
            },

            flight8: {
                text: "Kiki te serre fort. « Plus jamais sans préparation, » dit-elle, sa voix tremblante. « Je ne peux pas te perdre. Pas toi aussi. »\n\nElle te ramène sur le toit. « Recommençons. Mais cette fois, lentement. Avec prudence. »\n\nLe balai t'attend, patient.",
                choices: [
                    { text: "Réessayer avec plus de prudence", next: "flight3" },
                    { text: "« Parlons d'abord du voyage à Kyoto »", next: "scene10" }
                ]
            },

            flight9: {
                text: "« Pour aller vite, incline-toi vers l'avant, » enseigne Kiki. « Mais attention : plus tu vas vite, plus tu es vulnérable aux bourrasques. »\n\nElle démontre, filant comme une flèche à travers le ciel nocturne avant de revenir. « La vitesse est grisante. Mais mortelle si tu perds le contrôle. »",
                choices: [
                    { text: "Essayer la vitesse prudemment", next: "flight12" },
                    { text: "« Je préfère maîtriser la stabilité d'abord »", next: "flight6" }
                ]
            },

            flight10: {
                text: "« VOLATUS LENTUS. »\n\nTu descends progressivement, contrôlant ta vitesse. Dix mètres. Cinq mètres. Trois mètres. Atterrissage parfait sur le toit.\n\nKiki applaudit : « Excellent ! Tu as fait le bon choix. Beaucoup de sorcières meurent en voulant défier les éléments. »\n\nLe chat ronronne : « Elle apprend. C'est bon signe. »",
                choices: [
                    { text: "« Je suis prête pour le voyage »", next: "scene10" },
                    { text: "« Encore un peu de pratique »", next: "flight6" }
                ]
            },

            flight11: {
                text: "Au lieu de lutter contre le vent, tu te laisses porter. Tu danses avec lui, comme tu l'as fait avec VENTUS.\n\nLe balai devient une extension de toi. Tu vires, plonges, remontes. C'est du pur instinct. Du pur bonheur.\n\nKiki te regarde, les larmes aux yeux. « Tu es revenue. La vraie Mara est revenue. »",
                choices: [
                    { text: "Atterrir avec grâce", next: "flight13" },
                    { text: "Continuer à voler librement", next: "flight14" }
                ]
            },

            flight12: {
                text: "Tu t'inclines légèrement. Le balai accélère. La sensation est extraordinaire ! Le vent siffle, la ville défile sous toi.\n\nTu maintiens le contrôle, sentant chaque vibration du balai, anticipant chaque bourrasque.\n\nKiki vole à tes côtés : « Magnifique ! Tu as retrouvé ton don ! »",
                choices: [
                    { text: "Ralentir et atterrir en sécurité", next: "flight13" },
                    { text: "Pousser encore plus vite", next: "flight15" }
                ]
            },

            flight13: {
                text: "Tu atterris avec une grâce parfaite. Kiki te serre dans ses bras, pleurant de joie.\n\n« Tu es prête, » dit-elle. « Prête pour Kyoto. Prête pour affronter ce qui t'attend. Prête pour... »\n\nElle hésite, puis sort le parchemin scellé. « Prête pour la vérité. »",
                choices: [
                    { text: "« Partons pour Kyoto maintenant »", next: "scene10" },
                    { text: "« Dis-moi tout ce que tu sais d'abord »", next: "scene11" }
                ]
            },

            flight14: {
                text: "Tu continues à voler, testant tes limites. Acrobaties. Piqués. Vrilles. Chaque manœuvre réveille quelque chose en toi.\n\nMais la fatigue magique te frappe soudainement. Ta vision se trouble. Tes mains glissent du balai.\n\nTu tombes.",
                choices: [
                    { text: "« PLUMA CORPORIS ! » en panique", next: "flight16" },
                    { text: "« VOLATUS ASCENDO ! » pour rappeler le balai", next: "flight17" }
                ]
            },

            flight15: {
                text: "Tu forces le balai à aller toujours plus vite. Trop vite. Une bourrasque te frappe violemment.\n\nTu perds le contrôle. Le balai tourne sur lui-même. Tu es éjectée dans le vide nocturne.\n\nKiki hurle ton nom.",
                choices: [
                    { text: "« PLUMA CORPORIS ! » immédiatement", next: "flight16" },
                    { text: "Essayer de rattraper le balai en chute", next: "death6" }
                ]
            },

            flight16: {
                text: "« PLUMA CORPORIS ! »\n\nTon corps devient léger juste avant l'impact. Tu descends doucement, atterrissant sur le toit avec grâce malgré le choc.\n\nKiki se précipite vers toi : « Plus jamais ! » Elle te serre si fort que tu peux à peine respirer. « Tu m'as fait une peur bleue ! »",
                choices: [
                    { text: "« Je suis désolée »", next: "flight13" },
                    { text: "La réconforter", next: "flight13" }
                ]
            },

            flight17: {
                text: "« VOLATUS ASCENDO ! »\n\nLe balai répond à ton appel, filant vers toi. Tu le saisis en plein vol, te remettant en selle.\n\nKiki applaudit, impressionnée : « Je n'ai jamais vu personne faire ça ! C'est de la magie avancée ! »\n\nTu atterris, le cœur battant, adrénaline pulsant dans tes veines.",
                choices: [
                    { text: "« C'était... incroyable »", next: "flight13" },
                    { text: "« Mon instinct a pris le dessus »", next: "flight13" }
                ]
            },

            scene10: {
                text: "« Kyoto est à plusieurs heures de vol, » explique Kiki en préparant des provisions. « Nous devrons traverser des zones dangereuses. Des courants magiques instables. Et... la Forêt des Ombres. »\n\nSon visage s'assombrit. « C'est là que les esprits testent les voyageurs. Beaucoup y entrent. Peu en ressortent inchangés. »\n\nLe chat saute sur ton épaule : « Mais tu as récupéré ta magie. Tu as réappris à voler. Tu es aussi prête que tu peux l'être. »",
                choices: [
                    { text: "« Partons à l'aube »", next: "scene12" },
                    { text: "« Dis-moi ce qui m'attend vraiment »", next: "scene11" }
                ]
            },

            scene11: {
                text: "Kiki s'assoit, son visage grave dans la pénombre. « À Kyoto, il y a la Bibliothèque des Ombres. C'est là que sont gardés les grimoires de restauration. »\n\nElle prend tes mains. « Mais pour accéder au grimoire dont tu as besoin... tu devras payer un prix. » Ses yeux brillent de larmes. « Certains ont donné leur magie. D'autres, leur jeunesse. Certains... leur vie. »\n\n« La question est : combien es-tu prête à sacrifier pour te souvenir ? »",
                choices: [
                    { text: "« Tout ce qu'il faudra »", next: "scene12" },
                    { text: "« Il doit y avoir un autre moyen »", next: "scene13" }
                ]
            },

            scene12: {
                text: "L'aube se lève sur Osaka. Toi et Kiki vous tenez sur le toit, vos balais à la main.\n\n« Es-tu prête ? » demande-t-elle.\n\nTu regardes le parchemin scellé qu'elle porte. Quelque part au bout de ce voyage, des réponses t'attendent. Et quelqu'un qui t'aime.\n\n« VOLATUS ASCENDO, » dis-tu ensemble.\n\nVous vous envolez vers Kyoto. Vers ton destin.",
                choices: [
                    { text: "Voler vers l'horizon", next: "journey1" },
                    { text: "Regarder Osaka une dernière fois", next: "journey1" }
                ]
            },

            scene13: {
                text: "« Peut-être, » murmure Kiki. « Mais je n'en connais aucun. » Elle soupire. « La magie a toujours un prix. Toujours. »\n\nLe chat miaule : « Mais l'amour aussi a son propre pouvoir. Peut-être que ton lien avec cette personne est assez fort pour changer les règles. »\n\nKiki hoche la tête : « Une seule façon de le savoir. »",
                choices: [
                    { text: "« Alors allons à Kyoto »", next: "scene12" },
                    { text: "« Je veux me préparer mentalement d'abord »", next: "scene14" }
                ]
            },

            scene14: {
                text: "Cette nuit-là, tu médites. Tu repasses mentalement tous les sorts que tu as appris. LEVITAS. IGNIS MINOR. VENTUS. SANCTUM PROTECTUS. Les sorts de vol.\n\nTu es plus forte qu'au réveil. Mais es-tu assez forte ?\n\nDans tes rêves, tu entends une voix : « Mara... je t'attends... »\n\nTu te réveilles en larmes, le cœur serré par un manque que tu ne comprends pas encore.",
                choices: [
                    { text: "Réveiller Kiki : « Partons maintenant »", next: "scene12" },
                    { text: "Méditer sur le rêve jusqu'à l'aube", next: "scene12" }
                ]
            },

            journey1: {
                text: "Vous volez côte à côte à travers le ciel matinal. Les premières heures sont paisibles. La campagne japonaise se déroule en contrebas, magnifique et sereine.\n\nPuis, au loin, tu aperçois une masse sombre : la Forêt des Ombres. Même de loin, elle semble absorber la lumière.\n\n« C'est là, » dit Kiki, sa voix tendue. « Prépare-toi. »",
                choices: [
                    { text: "Descendre et entrer à pied", next: "journey2" },
                    { text: "Tenter de la survoler", next: "journey3" }
                ]
            },

            journey2: {
                text: "Vous atterrissez à la lisière de la forêt. L'air y est épais, suffocant. Des murmures s'élèvent des arbres - des voix de ceux qui ont échoué.\n\nDeux chemins s'ouvrent devant vous. L'un brille d'une fausse lumière dorée, séduisant. L'autre est noyé dans l'obscurité totale, terrifiant.\n\nLe chat gronde : « Choisis avec ton cœur, pas avec tes yeux. »",
                choices: [
                    { text: "Prendre le chemin lumineux", next: "death7" },
                    { text: "Plonger dans l'obscurité", next: "journey4" }
                ]
            },

            journey3: {
                text: "Vous tentez de survoler la forêt. Mais dès que vous êtes au-dessus des arbres, une force invisible vous tire vers le bas.\n\nVos balais deviennent incontrôlables. Vous êtes forcées d'atterrir dans la forêt même.\n\n« Il faut la traverser, » dit Kiki sombrement. « Il n'y a pas de raccourci. »",
                choices: [
                    { text: "Marcher vers la lumière", next: "death7" },
                    { text: "Marcher vers l'obscurité", next: "journey4" }
                ]
            },

            journey4: {
                text: "Vous plongez dans l'obscurité totale. Aucune lumière. Aucun repère. Juste le vide.\n\nMais dans ce vide, tu sens quelque chose. Une présence. Chaleureuse. Familière. Une main invisible frôle la tienne, te guidant.\n\nKiki murmure : « Quelqu'un veille sur toi. Même ici. »\n\nVous marchez pendant ce qui semble une éternité. Puis, enfin, vous émergez dans une clairière.",
                choices: [
                    { text: "Regarder ce qui se trouve dans la clairière", next: "journey5" },
                    { text: "Remercier la présence invisible", next: "journey5" }
                ]
            },

            journey5: {
                text: "La Bibliothèque des Ombres se dresse devant vous. Immense. Ancienne. Menaçante.\n\nUn bibliothécaire spectral apparaît, ses yeux vides te fixant. « Pourquoi es-tu venue, sorcière brisée ? »\n\n« Pour retrouver ce que j'ai perdu, » réponds-tu.\n\nIl rit, un son qui glace le sang. « Tout a un prix. Es-tu prête à payer ? »",
                choices: [
                    { text: "« Quel est le prix ? »", next: "journey6" },
                    { text: "« Montrez-moi d'abord le grimoire »", next: "journey7" }
                ]
            },

            journey6: {
                text: "« Le prix, » dit le bibliothécaire, « dépend de ce que tu cherches à retrouver. Pour de simples souvenirs : un an de ta vie. Pour des compétences perdues : ta magie future. Pour l'amour... »\n\nIl marque une pause dramatique.\n\n« Pour l'amour, le prix est une partie de ton âme. Tu te souviendras, mais tu ne seras plus jamais complète. »",
                choices: [
                    { text: "« Je paierai ce qu'il faut »", next: "journey8" },
                    { text: "« Il doit y avoir un autre moyen ! »", next: "journey9" }
                ]
            },

            journey7: {
                text: "Le bibliothécaire te mène dans les profondeurs de la bibliothèque. Des grimoires flottent dans les airs, certains en flammes, d'autres gelés.\n\nIl s'arrête devant un livre noir pulsant d'une énergie sombre. « Voilà ce que tu cherches. Le Grimoire des Mémoires Perdues. »\n\nTu tends la main, mais il l'arrête : « Pas encore. D'abord, le prix. »",
                choices: [
                    { text: "« Quel prix ? »", next: "journey6" },
                    { text: "Essayer de le saisir quand même", next: "journey10" }
                ]
            },

            journey8: {
                text: "Le bibliothécaire hoche la tête. « Bien. Mais avant de payer... » Il claque des doigts.\n\nUne vision apparaît devant toi : la personne que tu as oubliée. Tu ne vois toujours pas son visage clairement, mais tu sens... l'amour. Un amour qui transcende l'oubli.\n\n« Même après avoir payé, » dit-il, « cette personne restera maudite. Oubliée du monde. Sauf de toi. »",
                choices: [
                    { text: "« Alors je briserai la malédiction aussi »", next: "journey11" },
                    { text: "« Au moins, je me souviendrai »", next: "journey12" }
                ]
            },

            journey9: {
                text: "« Il n'y a pas d'autre moyen, » dit le bibliothécaire froidement. « La magie ne donne rien gratuitement. »\n\nKiki prend ta main : « Mara... peut-être qu'il y a quelque chose que le bibliothécaire ne sait pas. Ton lien avec cette personne est unique. »\n\nLe chat miaule : « L'amour véritable défie parfois même les lois de la magie. »",
                choices: [
                    { text: "« Laissez-moi lire le parchemin d'abord »", next: "journey13" },
                    { text: "« J'accepte le prix »", next: "journey8" }
                ]
            },

            journey10: {
                text: "Tu saisis le grimoire. Instantanément, une douleur atroce te traverse. Le livre te brûle, te gèle, te déchire de l'intérieur.\n\nLe bibliothécaire ricane : « Voleuse. »\n\nKiki hurle : « FINIS ! » en arrachant le livre de tes mains.\n\nTu t'effondres, fumante, blessée mais vivante.",
                choices: [
                    { text: "« Je... suis désolée... »", next: "journey14" },
                    { text: "Se relever difficilement", next: "journey14" }
                ]
            },

            journey11: {

                text: "« Tu as risqué ta vie pour me sauver. Tu as échoué. Mais ton courage... ton amour... c'était la chose la plus belle que j'aie jamais vue.\n\nJe t'ai parlé dans tes rêves. J'ai utilisé chaque once de magie qu'il me restait pour te guider. Même si le monde m'oublie, même si je disparais complètement... je veux que tu saches une chose. »",

            message3: {
                text: "« Je t'aime, Mara. Je t'ai toujours aimée. Je t'aimerai toujours.\n\nAlors maintenant, même si tu ne te souviens pas de moi, même si tu ne sais plus qui je suis... je veux te poser la question que j'ai toujours voulu te poser.\n\nVeux-tu être ma Valentine ?\n\nPas seulement aujourd'hui. Mais pour tous nos lendemains. Dans la lumière et dans l'ombre. Dans le souvenir et dans l'oubli.\n\nJe t'attends. Toujours.\n\nÉternellement tienne. »",

        let currentScene = 'start';
        let visitedScenes = new Set();

        function displayScene(sceneId) {
            if (!scenes[sceneId]) {
                console.error('Scène introuvable:', sceneId);
                displayScene('start');
                return;
            }

            currentScene = sceneId;
            visitedScenes.add(sceneId);
            
            const scene = scenes[sceneId];
            const content = document.getElementById('game-content');
            
            if (sceneId === 'start') {
                content.innerHTML = `
                    <div class="start-screen">
                        <h1 class="title">Les Ombres Oubliées</h1>
                        <p class="subtitle">Un récit de magie, de sacrifice et d'amour</p>
                        <p class="scene-text">${scene.text}</p>
                        <button class="start-btn" onclick="displayScene('scene1')">
                            Entrer dans l'ombre
                        </button>
                    </div>
                `;
            } else if (scene.choices.length === 0) {
                content.innerHTML = `
                    <div class="final-scroll">
                        <p class="scene-text">${scene.text}</p>
                    </div>
                `;
            } else if (sceneId.startsWith('death')) {
                content.innerHTML = `
                    <div class="death-screen">
                        <h2 class="death-title">💀</h2>
                        <p class="scene-text">${scene.text}</p>
                        <button class="restart-btn" onclick="displayScene('start')">Recommencer</button>
                    </div>
                `;
            } else {
                const sceneNumber = visitedScenes.size;
                let choicesHTML = '<div class="choices">';
                scene.choices.forEach((choice) => {
                    choicesHTML += `<button class="choice-btn" onclick="displayScene('${choice.next}')">${choice.text}</button>`;
                });
                choicesHTML += '</div>';
                
                content.innerHTML = `
                    <div class="scene-number">Chapitre ${sceneNumber}</div>
                    <p class="scene-text">${scene.text}</p>
                    ${choicesHTML}
                `;
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        displayScene('start');
    </script>
